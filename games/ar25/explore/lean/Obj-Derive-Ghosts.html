<style>
/* 只有尺寸与配色。**这个文件是「渲染方面的东西」的全部**，别往里加别的。

  --bg: #12141a;  --panel: #1a1d25;  --line: #2a2f3a;
  --ink: #e8eaf0;  --dim: #8b93a7;  --faint: #5a6275;

     以及一个不透明的 id（只许判相等）。名字换成本局的，个数随本局。
     下面这一组是某一局的样子，留着当个例子： */
  --floor: #262b36;
  --piece: #59b0ff;       /* 物件 */
  --ghost: #a878ff;       /* 镜像 */
  --band: #5f7488;        /* 分隔带 */
  --target: #e0a53a;      /* 目标 */
  --mark: #ffffff;        /* 中心格：被选中 */
  --link: #7ab8ff;  --fg: #e8eaf0;
  /* ↑↑↑ 本局专属到此为止 ↑↑↑ */

  --ok: #4caf7d;  --bad: #e5544b;  --na: #4a5163;

/* 具体的盘 */

<div class="card"><h2>镜像 = 反射群下的像</h2>
<p class="note">角色：对象 · 组：Obj/Derive · 对应 Python：derive/ghosts.py · 编译 1.0 秒 · 1270 字节</p>
<p class="note">这一份里没有定理（定义 / 判据 / 数据）。</p>
</div>
<div class="card"><h2>源码</h2><pre class="lean" id="code0"></pre></div>
</div>
<script>window.PAGE = {"shots": {}, "codes": {"code0": "/-\n# Ghosts —— 镜像落在哪些块（对应 `derive/ghosts.py`，**独立写的**，不是从 Python 导出来的）\n\n全部物件块在「这组轴生成的反射群」下的像：落在盘内、又不在物件本体上的那些。\n\n    没有轴           没有镜像\n    一条轴           它的反射\n    一横一竖两条     两个反射 + 两次反射的复合（绕交点的点对称）\n    两条平行 / 更多   **说不准**（群是无穷的或没见过）—— `none`\n\nPython 那一份用「生成元闭包」算群；这里按轴的条数分情形写。两份各自写、逐帧和观测对账\n（`Obs/Check.lean` 的 `agrees` 比的就是这一位：模型算出来的镜像掩码 == 帧上读到的色 4）。\n\n**这一份里没有一条定理。**\n-/\nimport Obj.World\n\nnamespace Game\n\n/-- 一个变换：一串「关于某条线反射」依次做。 -/\nabbrev Xform := List Line\n\ndef applyX : Xform → Cell → Option Cell\n  | [], x => some x\n  | l :: rest, x => match l.reflect x with\n    | some y => applyX rest y\n    | none => none\n\n/-- 这组轴生成的全部非恒等变换；说不准返回 `none`。 -/\ndef transforms : List Line → Option (List Xform)\n  | [] => some []\n  | [l] => some [[l]]\n  | [l1, l2] => if l1.horiz != l2.horiz then some [[l1], [l2], [l1, l2]] else none\n  | _ => none\n\n/-- 一串块在这些变换下的像（盘内）的掩码。 -/\ndef imageMask (ts : List Xform) (xs : List Cell) : Nat :=\n  ts.foldl (fun m t => xs.foldl (fun m x => match applyX t x with\n    | some y => m ||| bit y\n    | none => m) m) 0\n\n/-- 镜像块的掩码；说不准返回 `none`。 -/\ndef ghostMask (w : World) : Option Nat :=\n  match transforms w.lines with\n  | some ts => some (minusMask (imageMask ts (w.pieces.foldl (fun acc p => acc ++ p.cells) [])) w.body)\n  | none => none\n\nend Game\n"}};</script>
<script>
// 页面那一侧：**只画，不算。**
//
// 每一张盘都是 web/export.py 算好的一串角色码（一块两个字符：边框 + 中心），
// 每一个数都是验收落盘的那一份。这里新增的只有两样：尺寸与配色。
// web/check_no_logic.py 会来这里搜对象层 / 规则层 / 形式化层的函数名，搜到就算破。

(function () {
  "use strict";
  const $ = (id) => document.getElementById(id);
  const P = window.PAGE || {};

  // ---- 配色：角色码 → 颜色（**前端配的**，不是世界里的色号）
  const EDGE = { ".": "var(--floor)", P: "var(--piece)", G: "var(--ghost)", B: "var(--band)", T: "var(--target)" };
  const CENTER = { ".": "var(--floor)", P: "var(--piece)", G: "var(--ghost)", B: "var(--band)",
                   T: "var(--target)", M: "var(--mark)" };

  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  // 一张盘：21×21 块。`hi` 是导出侧算好的「这一步变了的块」，这里只描边。
  function board(code, opt) {
    opt = opt || {};
    const s = opt.size || 13, n = 21, pad = 1;
    if (!code) {
      return `<svg class="grid" width="${n * s}" height="${n * s}"><text x="10" y="24" fill="#8b93a7" font-size="12">`
        + `${esc(opt.empty || "这一帧读不成世界")}</text></svg>`;
    }
    const hi = new Set((opt.hi || []).map((p) => p[0] * n + p[1]));
    let out = `<svg class="grid" width="${n * s}" height="${n * s}" viewBox="0 0 ${n * s} ${n * s}">`;
    for (let i = 0; i < n * n; i++) {
      const e = code[2 * i], c = code[2 * i + 1];
      const x = (i % n) * s, y = Math.floor(i / n) * s;
      if (e !== "." || c !== ".") {
        out += `<rect x="${x + pad}" y="${y + pad}" width="${s - 2 * pad}" height="${s - 2 * pad}" fill="${EDGE[e]}"/>`;
        const k = Math.round(s / 3);
        out += `<rect x="${x + k}" y="${y + k}" width="${s - 2 * k}" height="${s - 2 * k}" fill="${CENTER[c]}"/>`;
      } else {
        out += `<rect x="${x + pad}" y="${y + pad}" width="${s - 2 * pad}" height="${s - 2 * pad}" fill="var(--floor)" opacity=".35"/>`;
      }
      if (hi.has(i)) {
        out += `<rect x="${x + 0.5}" y="${y + 0.5}" width="${s - 1}" height="${s - 1}" fill="none" stroke="#fff" stroke-width="1.2"/>`;
      }
    }
    return out + "</svg>";
  }

  function figure(title, code, opt) {
    return `<figure class="board"><figcaption>${esc(title)}</figcaption>${board(code, opt)}</figure>`;
  }

  function legend() {
    return `<div class="legend">`
      + `<span><i style="background:var(--piece)"></i>物件</span>`
      + `<span><i style="background:var(--ghost)"></i>镜像</span>`
      + `<span><i style="background:var(--band)"></i>分隔带（镜像轴）</span>`
      + `<span><i style="background:var(--target)"></i>目标</span>`
      + `<span><i style="background:var(--mark)"></i>中心格白 = 被选中</span>`
      + `<span>小方块是中心格：边框是最上面那一层，中心写「选中 / 目标 / 状态」</span></div>`;
  }

  // ---- 首页 / 对象页 / 规则页：摆几张导出侧挑好的盘
  function initShots() {
    for (const [id, s] of Object.entries(P.shots || {})) {
      const el = $(id);
      if (!el) continue;
      el.innerHTML = s.items.map((x) => figure(x.title, x.code, { size: x.size || 13, hi: x.hi })).join("")
        + (s.legend ? legend() : "");
    }
  }

  // ---- 回放：一步一步看。每一步的盘、变了哪几块、每条规则说了什么，全是导出的
  function initReplay() {
    const R = P.replay;
    if (!R) return;
    const slider = $("seq"), label = $("steplabel");
    slider.max = R.steps.length - 1;
    function show(i) {
      const s = R.steps[i];
      const f0 = R.frames[s.prev], f1 = R.frames[s.next];
      label.textContent = `第 ${s.seq} 步 / 共 ${R.steps.length} 步 · 第 ${s.lvl} 关 · ${s.act}` + (s.up ? " · 这一步过关" : "");
      $("boards").innerHTML =
        figure("这一步之前", f0.blocks, {}) +
        figure(s.up ? "这一步之后（已是下一关 / 终局）" : "这一步之后（白框 = 变了的块）", f1.blocks,
               { hi: s.up ? [] : s.changed, empty: f1.unreadable ? "读不成世界：" + f1.unreadable : "" }) + legend();
      const facts = (f) => f.blocks ? `计数带用掉 ${f.used} 格 · 选中：${esc(f.sel)} · 轴：${esc(f.lines.join("、") || "无")}`
        + (f.frozen.length ? ` · 推不动的线：${esc(f.frozen.join("、"))}` : "") : "—";
      $("facts").innerHTML = `<div>之前：${facts(f0)}</div><div>之后：${facts(f1)}</div>`
        + `<div class="note">变了 ${s.changed.length} 块（导出侧逐块比出来的）· tid ${esc(s.tid)}（内容哈希）</div>`;
      let rows = "";
      for (const [name, v] of Object.entries(s.verdicts)) {
        rows += `<tr><td><a href="rules/${name}.html">${name}</a></td>`
          + `<td><span class="chip ${v[0]}">${v[0] === "NA" ? "不管" : v[0] === "TRUE" ? "对" : v[0] === "FALSE" ? "错" : "读不成"}</span></td>`
          + `<td class="note">${esc(v[1])}</td></tr>`;
      }
      $("verdicts").innerHTML = `<table><tr><th>规则</th><th>这一步</th><th>不管的理由</th></tr>${rows}</table>`;
    }
    slider.addEventListener("input", () => show(+slider.value));
    $("prev").addEventListener("click", () => { slider.value = Math.max(0, +slider.value - 1); show(+slider.value); });
    $("next").addEventListener("click", () => { slider.value = Math.min(R.steps.length - 1, +slider.value + 1); show(+slider.value); });
    const jump = $("jump");
    if (jump) jump.addEventListener("change", () => { slider.value = jump.value; show(+jump.value); });
    show(0);
  }

  // ---- Lean 源码上色（从模板搬的；它不理解一个字，只认注释、字符串和几十个词）
  const KEY = ("theorem|def|abbrev|structure|inductive|instance|namespace|end|import|deriving|open|" +
    "by|fun|match|with|let|have|show|if|then|else|do|where|from|at|using|set_option").split("|");
  const TAC = ("simp|omega|decide|rfl|exact|intro|intros|cases|rcases|obtain|refine|constructor|" +
    "rintro|induction|split|rw|apply|unfold|absurd|first|next|subst|rename_i").split("|");

  function paint(src) {
    let h = esc(src);
    h = h.replace(/\/-[\s\S]*?-\//g, (m) => `\u0001${m}\u0002`);
    h = h.replace(/--[^\n]*/g, (m) => `\u0001${m}\u0002`);
    h = h.replace(/(^|[^\w'])(#print|#eval)\b/g, (m, a, b) => `${a}\u0005${b}\u0006`);
    const kw = new RegExp("(^|[^\\w'.])(" + KEY.join("|") + ")(?![\\w'])", "g");
    h = h.replace(kw, (m, a, b) => `${a}\u0007${b}\u0008`);
    const tc = new RegExp("(^|[^\\w'.])(" + TAC.join("|") + ")(?![\\w'])", "g");
    h = h.replace(tc, (m, a, b) => `${a}\u000b${b}\u000c`);
    return h
      .replace(/\u0001/g, '<i class="c">').replace(/\u0002/g, "</i>")
      .replace(/\u0005/g, '<i class="p">').replace(/\u0006/g, "</i>")
      .replace(/\u0007/g, '<i class="k">').replace(/\u0008/g, "</i>")
      .replace(/\u000b/g, '<i class="t">').replace(/\u000c/g, "</i>");
  }

  function initCode() {
    for (const [id, src] of Object.entries(P.codes || {})) {
      const el = $(id);
      if (el) el.innerHTML = paint(src);
    }
  }

  document.addEventListener("DOMContentLoaded", () => { initShots(); initReplay(); initCode(); });
})();

</script>
</body>
</html>
