推论。","evidence_steps":[17,186,223]},{"name":"parity_flips_iff_blocked","group":"一步怎么走","claim":"列方向的一步里，两块列差的奇偶翻转 ⇔ 恰有一块被挡（被挡块数为奇数）。","not_claimed":"不断言是哪一块被挡。","doc":"列差奇偶只有「恰有一块被挡」能翻。\n\n两块一块照 (dr, dc)、另一块照 (dr, −dc)：都走成或都被挡时列差变 0 或 ±2，奇偶不变；恰有一块被挡时变 ±1。\n所以它是 pieces_move 的**推论**（形式化那一侧是 `Derived/` 下的一条定理），不是独立的规则。\n留着在语料上判，是因为它说出了这一局的算术：撞到一格要列差为 0（偶数），\n一关的全部工作就是用墙（和门、记号）制造奇数次「恰有一块被挡」。","history":["起点册子 v1（起因：dest_set 的开口率随列差奇偶跳变）。","卡 04 v1：在对象上重写。卡 05 v2：主张不变，身份定为「推论」（形式化 Derived/）。"],"evidence":["14dbaaee74e9e2dd","9ad082100dcdffb2","aac863a41447fb39","a3fe86c271ddada8"],"scope":95,"N":388,"C":95,"E":0,"U":3,"N_reasons":{"不是列方向的方向键":290,"两种标法被挡块数奇偶不同":52,"选中态":38,"换关":8},"dC":92,"dE":0,"identity":"derived","lean":"Derived/ParityFlipsIffBlocked.lean","rej":8,"uniq":0,"red_by":[{"mutant":"镜像不取反","n":33,"why":"另一块也照位移走（不镜像）"},{"mutant":"记号不挡路","n":13,"why":"记号格当地面"}],"notes":"同 mirror_pair_persists：**独家 0 正是推论该有的读数**（`Derived/ParityFlipsIffBlocked.lean` 证出来了）。\n论域 95 条、判错 0。源码突变体「镜像不取反」让它判错 33、「记号不挡路」13——它读的正是被挡没被挡。","evidence_steps":[170,171,172,173]},{"name":"pieces_move","group":"一步怎么走","claim":"没选中记号时按方向键：一块照位移走、另一块照镜像位移走，意图落点进得去就进、否则原地不动（墙、记号、关着的门、格阵边界挡路；开关、地面、开着的门、另一块此刻站的格进得去）。","not_claimed":"不断言哪一块是 direct；不断言走空的格变成什么（块底下盖着什么帧上读不出来）；有标法往危险格迈步的那一步归 hazard_resets；换关那一步归 collide_wins。","doc":"两块怎么走：一块照位移、一块照镜像位移，各自进得去就进、否则原地不动。\n\n## 为什么是这一条而不是起点册子那六条\n\n起点册子里关于「两块怎么走」的话散在六条里：move_iff_clear（落点集合）、move_delta（位移多重集）、\ndest_set（两种标法一致的那部分）、identity_needs_one_move（恰有一种标法对得上）、\nland_on_floor_only（落点在上一帧是进得去的格）、piece_survives_on_gate（从门格上走开是普通一步）。\n它们的论域互相咬着，说的是**同一件事的不同投影**：落点集合相等，就推得出位移多重集、\n一致的那部分、落点进得去、从门格走开也照走；「恰有一种标法对得上」在两种标法落点不同时\n是集合相等的直接推论（两个不同的集合不可能都等于同一个）。所以合成这一条，说最强的那一句。\n合并之后拒绝集没有变小——读数见 analysis/record.txt 卡 05 那一段。\n\n## 纤维\n\n两块哪一块是 direct 帧上读不出来，所以这一条问的是：**两种标法里，有没有一种算出的落点就是下一帧**。","history":["卡 04 v1：起点册子六条（move_iff_clear v12 / move_delta v6 / dest_set v3 / identity_needs_one_move v2 / land_on_floor_only v2 / piece_survives_on_gate v3）各自在对象上重写，六条读  (64·m + 75) div 150（= round(64·m/150)）。危险重来不归零，换关归零。","not_claimed":"不断言带子满了（m = 150 附近）之后会怎样——语料里一关最多走了 101 步，带长最多 43，带子从没满过；不断言这只钟是不是一份「预算」。","doc":"计数带是一只时钟：**这一关走了 m 步之后，带长 = round(64·m / 150)**（四舍五入，半格进位）。\n\n起点册子只说到「单调、每步至多 +1」，推进的时机当时没解出来（hud_step_timer「带长 = 步数 / 2」\n被 9 条连续转移打脸后撤册，hud_monotone 于是把「什么时候涨」留成空槽）。\n卡 05 这一轮把空槽填上了，来路写在明处：用语料里全部 6 关、两段各自的「本关已走步数 → 带长」\n逐步对（m = 0..100，没有一处自相矛盾），再在几类公式里穷举：`floor((a·m + b)/c)`（c < 60）一个都不合，\n`round(64·(m + 偏移)/B)`（B = 50..1999，三种取整）只有一个合上——B = 150、偏移 0、四舍五入。\n换成整数：带长 = (64·m + 75) div 150。\n\n它读 `ctx[\"m\"]`（这一段、这一关里这一步之前已经走了几步）。**m 是上游给的事实，不是帧上读得出的**：\n带长 3 对应 m = 6、7、8 三种。所以这一条比单看两帧强得多，代价是它读了一位历史——写在明处。\n\n两个实测细节，也是这一条的一部分：\n  · 往危险格迈步、这一关从头来过之后，**带子不归零**，接着走（语料里两次）；\n  · 换关之后带子归零（下一关的第 0 步）。","history":["起点册子 hud_monotone v2：单调、每步至多 +1、顶带 = 底带（hud_step_timer「步数 / 2」已撤册）。","卡 04 v1：顶带 = 底带搬进 parse（W4），其余在对象上重写，判错 0。","卡 05 v2：换成时钟公式——拒绝集只会变大（单调、每步至多 +1 是它的推论）。"],"evidence":["6ff14786341388c8","aac9b64b6347dbdf","594db52aa44db62a"],"scope":485,"N":0,"C":485,"E":0,"U":1,"N_reasons":{},"dC":469,"dE":0,"identity":"def","lean":"Rule/Response/BandClock.lean","rej":77,"uniq":4,"red_by":[{"mutant":"时钟慢半格","n":453,"why":"带长向下取整而不是四舍五入"}],"notes":"独家 4 个（v1 的 hud_monotone 独家 3 个、拒掉 61 个；换成时钟公式之后拒掉 77 个）。\n源码突变体「时钟慢半格」（四舍五入改成向下取整）让它判错 453——几乎每一步都红，公式的每一位都在承重。","evidence_steps":[0,6,63]},{"name":"gate_follows_switch","group":"世界怎么回应","claim":"某色的门开着，当且仅当有块站在同色的开关上。","not_claimed":"不断言不同色之间有没有牵连（语料里没见过）；不断言块能不能走进一格关着的门（那是 pieces_move 的事：关着的门挡路）；另一块停在看不见底下的格上时，走开那一句不说。","doc":"门跟着开关：**某色的门开着，当且仅当有块站在同色的开关上。**\n\n## 为什么是这一条而不是起点册子那三条\n\n起点册子里门的开合是三条：switch_opens_gate（踏上开关那一步门开）、\ngate_closes_on_leave（从开关上走开那一步门关）、gate_stays_open（没人踏上也没人走开时门不自己变）。\n三条各说「变化的那一瞬」或「中间那段」，合起来正好是一句**状态**的话——门的开合是开关上有没有块的函数。\n卡 05 的合并理由第二种：「几条各说变化的那一瞬，而中间一直保持谁也没说」——这里中间那段倒是有人说了，\n但三条是同一个等价的三个投影。合成一条，说那个等价。\n\n## 帧上看得见的只是它的影子\n\n开着的门和地面一样，块站着的那一格底下是什么也看不见。所以这一条只能在**看得见变化**的地方判，\n三种情形（逐个颜色看；「看得见的开关 / 门」取这一步前后两帧的并）：\n\n    踏上  有块这一步落到一个看得见的 k 色开关上      ⇒ :"留着——它是「赢」的定义。独家 0 的原因：数据变异只改 next 帧 / 换 prev，**不改「换没换关」这一位**（那是 meta），\n而这一条读的正是那一位。能打到它的变异是源码侧的：「撞到一格不算赢」让它判错 12（全部 12 次过关），\n「另一块的格不让进」**只**让它红（4）——那 4 步是一块走进另一块此刻站的格而撞上，别的规则都看不见。","evidence_steps":[6,17,19,54]},{"name":"hazard_resets","group":"什么算赢什么算砸","claim":"没选中记号时按方向键、而有一种标法让某块往危险格迈步：按纤维判——要么那种标法是真的，这一关从头来过（不换关、两块都不在危险落点上、两块换了位置）；要么另一种标法是真的，它照平常一步 / 过关去对下一帧。","not_claimed":"**不断言开局在哪**：从头来过之后两块回到哪、记号复位到哪，是这一关的历史，一帧上读不出来。（语料里两次实测：第 1、3 关各一次，网格内逐像素等于该关开局那一帧，计数带接着走——这是读数，不是这条的主张。）","doc":"往危险格迈一步 = 这一关从头来过。","history":["起点册子 hazard_resets v3 前它长期 N=0：kind_of 在奇数边长的关上一格危险都认不出来。v4 让出选中态。","卡 04 v1：在对象上重写 v4（「有一种标法迈危险格」就开口、断言重来的形状）。","卡 05 v2：改按纤维判。v1 在「只有一种标法迈危险格、而另一种才是真的」时会冤判 FALSE；pieces_move 让出来的正是这一类步，这里接住。"],"evidence":["0697e3336bd6bffa","d3efe0230197451a"],"scope":2,"N":481,"C":2,"E":0,"U":3,"N_reasons":{"没有标法往危险格迈步":325,"选中态（方向键推记号，块不迈步）":92,"不是方向键":64},"dC":2,"dE":0,"identity":"def","lean":"Rule/Outcome/HazardResets.lean","rej":0,"uniq":0,"red_by":[{"mutant":"重来不换位置","n":2,"why":"往危险格迈步之后两块原地不动（而不是回到开局）"}],"notes":"留着。论域只有 2 步（行 31、164），120 个变异里没有一个落在这 2 步上——拒掉 0 个，独家当然 0。\n那是「没人做过那个动作」的变异版，不是它没说话：它是唯一说「往危险格迈一步会怎样」的规则。\n能打到它的变异（源码侧，已跑）：「重来不换位置」只让它红（2）。","evidence_steps":[31,164]},{"name":"terrain_static","group":"说了但不进模型","claim":"同一关内墙和危险格一格不变，记号个数不变。","not_claimed":"记号的位置、开关与门的开合不管（它们会变，归别的规则）。","doc":"同一关内地形是死的：墙和危险格一格不变，记号个数不变。\n\n## 为什么不进模型\n\n形式化那一侧把墙和危险格住进 `Board`，而 `Board` 不是状态的字段——`step` 连碰都碰不到它。\n于是「走一步地形不会变」在模型里**表示不出来**：不用证，也证不了，它没有一个能写下来的反面。\n所以它的身份是「不进模型」，理由是**表示不出来**，不是「没翻译」。\n\n它在 Python 这一侧照样每一步判着：模型的这个架构选择对不对，只有语料能驳——\n哪天有一步墙变了，这一条当场判 FALSE，而那时模型的 `Board` 就得拆。","history":["起点册子 terrain_static v1「整关地形恒定」被第 71 步（记号被推走）打脸，v2 让出记号；v3 被第 186 步（踏上开关、门变地面）打脸，再让出物件格。","卡 04 v1：在对象上重写（墙、危险格逐格相等，记号个数相等）。","卡 05 v2：主张不变，挪进「说了但不进模型」——模型那一侧它表示不出来。"],"evidence":["6ff14786341388c8","de906fa51c958612","19c8b95e5cc76810","aec3abdcbf3f67e7"],"scope":473,"N":10,"C":473,"E":0,"U":3,"N_reasons":{"换关":10},"dC":457,"dE":0,"identity":"unmodeled","lean":"Rule/Unmodeled/TerrainStatic.lean","rej":56,"uniq":9,"red_by":[],"notes":"独家 9 个——全册最多。它在形式化那一侧**不进模型**（Board 不是状态，「墙会变」表示不出来），\n所以 Python 这一侧是它唯一挨打的地方：模型的这个架构选择对不对，只有这一条的读数能驳。\n论域 473 条、被驳倒 0 次（卡 08「不进模型」那一组要的两个数）。","evidence_steps":[0,2,70,185]}],"rule_groups":[{"dir":"一步怎么走","title":"**这一组管：按一下之后，谁动、动到哪。**","why":"两块怎么走、选中之后方向键推什么、点一下选中什么、等一步动不动。\n不说「算不算赢 / 算不算砸」（隔壁 `什么算赢什么算砸/`），也不说门和计数带（`世界怎么回应/`）。"},{"dir":"世界怎么回应","title":"**这一组管：两块动了之后，世界自己起了什么变化。**","why":"门跟着开关上有没有块开合；计数带跟着步数长；地形不动。\n这些不是玩家直接搬的，是被别的事牵着变的。"},{"dir":"什么算赢什么算砸","title":"**这一组管：这一步之后这一关还在不在。**","why":"两块撞到一格 = 过关；往危险格迈步 = 这一关从头来过。\n两种后果的下一帧都不是「走到了某个状态」——一个是下一关，一个是这一关的开局。"},{"dir":"说了但不进模型","title":"**这一组：说了、在语料上判着，但明说不进模型。**","why":"每一条都要写理由，并且打两个数（卡 08）：论域条数（语料里多少条转移落在它管的范围里）、\n被驳倒几次。论域是 0 的话照样判红——一条谁也管不着的假设和一条从没被驳倒的假设，读数上必须分得开。"}],"objects":[{"name":"act","group":"action","doc":"一步的输入：方向键 / 点一下 / 等一步 / 整局重来。","docstring":"动作 —— 玩家这一步按了什么。**不是世界的字段**，是一步的输入。\n\n    Move(Delta)   方向键（ACTION1..4）：上 / 下 / 左 / 右 各一格\n    Click(Cell)   点一下（ACTION6:x,y）。点在格阵之外时 `cell` 为 None\n    Wait          ACTION5：花掉一步，什么也不动\n    Reset         RESET：整局从头来过\n\n点击的像素坐标折算成格点要用这一关的几何（格边长、原点），那是像素的事，\n所以折算在 `objects/parse.py` 的 `parse_action` 里做——全局唯一碰像素的地方。","field":null,"py":"objects/action/act.py","ablation":null,"why":"","abl_notes":"","lean":"Obj/Action/Act.lean"},{"name":"band","group":"clock","doc":"帧顶与帧底那条随步数变长的带子的长度（两处读法必须相等）。","docstring":"计数带 —— 帧顶那一行从右往左、帧底那一行从左往右长的那条带子。`World.band` 是它的长度（像素）。\n\n**同一个量有两处读法**（顶行、底行），两处必须相等——那是解析的良构检查。\n起点册子只断言到「单调、每步至多加一」，推进的时机当时没解出来。","field":"band","py":"objects/clock/band.py","ablation":513,"why":"对象 band（计数带长度）　—— 卡 02 首版；卡 06：欠账结清——它是时钟（band_clock），消融 61 → 513 处，判决：留（见 字段-band.txt）\n\n1. 它记的是什么：帧顶 / 帧底那条带子此刻多长（像素）。顶底两处读法相等是解析的良构检查 W4。\n2. 哪几条规则读它：起点册子只有 hud_monotone（单调、每步至多 +1）。别的规则都不读。\n3. 抹成常量：待跑（卡 06）。\n4. 分离表：分得开（表一见证 第 0 / 3 帧）。和 2 对得上：有见证、有一个读者。\n\n它是「一位玩法需要的信息」吗：起点册子没解出它什么时候涨。这一位现在只被一条弱规则读——\n留着，理由是分离表有见证、而且它是全语料里唯一一个和位置无关、每几步就变一次的量；\n它是不是一只时钟（只由本关已走步数决定），要等规则长出来才判得了（欠账，卡 06）。\n","abl_notes":"必要。读者：band_clock（带长 = (64·m + 75) div 150）；wait_noop / click_selects 明说把它让出去。\n卡 02 那时它只有一个弱读者（hud_monotone：单调、每步至多 +1），消融 61 处；卡 05 换成时钟公式之后 513 处——\n**同一位信息，读它的那句话变强了，消融读数跟着涨**。那一对世界：第 0 / 3 帧（只差带长）。\n它和 m（这一关走了几步）不是一回事：带长 3 对应 m = 6、7、8，m 帧上读不出来，进的是 ctx，不进世界。","lean":"Obj/Clock/Band.lean"},{"name":"gate","group":"device","doc":"连成条的物件格：关着时挡路；开着时和地面一样，帧上看不见。","docstring":"门 —— 连成条的物件格（四邻有同色物件格）。`World.gates` 是这一帧**看得见的、关着的**门格。\n\n关着的门挡路；门开着的时候那几格和地面一模一样，**帧上读不出「这里有扇门」**。\n所以这一帧的 `gates` 只是「此刻关着的那几格」，一扇开着的门在这一帧里不存在。\n要知道整关有哪些门，得把这一关的帧拼起来（形式化那一侧的「整关取并集」口径）。","field":"gates","py":"objects/device/gate.py","ablation":198,"why":"对象 gates（看得见的、关着的门格：格点 + 不透明的色名）　—— 卡 02 首版；卡 06：欠账结清——消融 198 处（全来自开合；「挡路」那一半没被检验），判决：留（见 字段-gates.txt）\n\n1. 它记的是什么：此刻关着的门格。开着的门和地面一样，帧上看不见，所以这一位只装「关着的」。\n2. 哪几条规则读它：switch_opens_gate / gate_closes_on_leave / gate_stays_open / piece_survives_on_gate；\n   移动规则（关着的门挡路）。\n3. 抹成常量：待跑（卡 06）。\n4. 分离表：两张表都分不开。门只在块踏上 / 走开开关时变，那一步 pieces 一定也变——同生共死于 pieces。\n\n处置：留着，进欠账（缺：消融）。它不能由 pieces 从**这一帧**算出来：要知道哪几格是门，得先知道\n整关的门在哪，而开着的门帧上读不出——这正是形式化那一侧要「整关取并集」的原因。\n","abl_notes":"必要。读者：gate_follows_switch（三支都读）、pieces_move（经 derive/passable：关着的门挡路）、\nclick_selects / wait_noop（除 lit、band 以外字段不变）。分离表两张都「分不开」——门只在块踏上 / 走开开关时变，\n那一步 pieces 一定也变（同生共死于 pieces）；但消融 198 处说明规则在用它，**不能合进 pieces**：\n门开不开是「块站在哪」加「整关的开关在哪」的函数，而整关的开关与门在单帧上看不全。\n**留了一个没被检验的读法**：「关着的门挡路」这一半，在真实走法下一次都没被撞过（两侧突变体都没红，见 reverse.json /\nlean2/readings.json）。消融这 198 处全来自门的**开合**，不来自挡路。","lean":"Obj/Device/Gate.lean"},{"name":"marker","group":"device","doc":"地面上画着小方块的格：挡路；被选中之后方向键推的是它。","docstring":"记号 —— 地面上画着一个小方块的格。`World.markers` 是这一帧全部记号所在的格点。\n\n花纹：整格只有正中央一小方块是非地面色，四周留一圈**一格宽**的地面色边框。\n中心边长取 `side - 2`，不取 `side // 2`（边长 5 的关上两者不一样，写错过一次）。\n\n它挡路（块撞上去原地不动），但它**不是地形**：被选中之后，方向键推的是它。","field":"markers","py":"objects/device/marker.py","ablation":190,"why":"对象 markers（全部记号所在的格点）　—— 卡 02 首版；卡 06：消融 190 处，判决：留（见 字段-markers.txt）\n\n1. 它记的是什么：地面上画着小方块的那几格在哪。它们挡路，被选中后能被推。\n2. 哪几条规则读它：push_door / click_selects（点中的是不是记号）/ terrain_static（记号个数不变）/\n   所有移动规则（记号挡路，由 kind_of 读进去）。\n3. 抹成常量：待跑（卡 06）。\n4. 分离表：表一分不开；**表二（扣掉 band）分得开**，见证 第 123 / 637 帧。\n   表一分不开的原因是计数带：推一次记号至少花一步，带子多半跟着变。扣掉 band 就有了见证。\n   这是「分不开」的第二种（和别的字段同生共死）里最常见的那一类：被一只时钟连带着变。\n\n为什么删不掉：那一对世界只差记号的位置，而记号挡路——同一个方向键，一边块撞上记号原地不动，\n另一边走得过去。\n","abl_notes":"必要。读者：lit_arrows_push_marker（推记号）、click_selects（点中的是不是记号）、pieces_move（记号挡路）、\nterrain_static（记号个数不变）。表二（扣掉 band）见证 第 123 / 637 帧。突变体「记号不挡路」红（判错 52）。\nlit ∈ markers 在 969 帧上反例 0（可推出性），但 lit 不能并进 markers：选中是另一位（「哪一个」），不是位置。","lean":"Obj/Device/Marker.lean"},{"name":"selection","group":"device","doc":"此刻被选中的那个记号（至多一个）；两块变色是同一位信息的第二个写法。","docstring":"选中 —— 此刻被选中的那个记号（`World.lit`），没有就是 `None`。\n\n**同一位信息在帧上有两处读法**：一处是那个记号的中心变了色，一处是两块整体变了色。\n两处必须对得上——这句话不是一条每帧要判的规则，是解析的**良构检查**\n（`objects/parse.py`）：对不上就这一帧读不成世界。起点册子里它曾是一条规则\n（`dim_iff_highlight`），搬进解析之后分母从「转移」变成了「帧」。\n\n至多一个记号被选中；两块的颜色于是不进世界，它就是这一位的第二个写法。","field":"lit","py":"objects/device/selection.py","ablation":307,"why":"对象 lit（被选中的记号，至多一个；没有就是 None）　—— 卡 02 首版；卡 06：消融 307 处，判决：留（见 字段-lit.txt）\n\n1. 它记的是什么：此刻哪一个记号被选中。帧上有两处读法（记号中心点亮色、两块整体换色），\n   两处对得上是解析的良构检查 W3——起点册子里的 dim_iff_highlight 就此从「规则」变成「良构检查」，\n   两块的颜色于是不再单独进世界（同一位信息的第二个写法，卡 03 意义上的「合」，在解析里就做掉了）。\n2. 哪几条规则读它：frozen_when_selected / push_door / click_selects / hazard_resets（选中态下不迈步）/\n   以及所有移动规则的论域（选中态下方向键不搬块）。\n3. 抹成常量：待跑（卡 06）。\n4. 分离表：分得开（表一见证 第 123 / 631 帧：只差选中与否）。和 2 对得上。\n\n为什么删不掉：那一对世界里按同一个方向键，一个搬块、一个推记号——玩法不同。\n","abl_notes":"必要。读者：lit_arrows_push_marker（论域与主张）、pieces_move / hazard_resets / derive/predict（选中态下方向键不搬块）、\nclick_selects（点完选中谁）。那一对世界：第 123 / 631 帧（只差选中与否）——同一个方向键，一边搬块、一边推记号。\n它是卡 03 那一刀「合」的产物：两块的选中色和记号的点亮色是同一位信息的两处读法，解析里核成这一位（良构检查 W3），\n两块的颜色不再单独进世界。卡 06 重量：W3 在 969 帧上 0 次抛出，突变体「选中色认错」让 612 帧读不成——两处读法确实绑在一起。","lean":"Obj/Device/Selection.lean"},{"name":"switch","group":"device","doc":"孤立的物件格：块站得上去；有块站着时同色的门开着。帧上只看得见没被块盖住的。","docstring":"开关 —— 一格孤立的物件格（四邻没有同色的物件格）。`World.switches` 是这一帧**看得见的**开关。\n 让出去）、terrain_static。\n那一对世界要靠「同一张盘、只差一格是危险还是墙」才分得开——语料里没有（语料分不开），\n但规则那一侧的分叉是实在的：墙是原地不动，危险是整关重来（行 31、164）。\n突变体「危险格当地面」「危险花纹不认」都红了（pieces_move 判错 2），这一位不是摆设。","lean":"Obj/Terrain/Hazard.lean"},{"name":"wall","group":"terrain","doc":"进不去的格：块走过去就原地不动。","docstring":"墙 —— 进不去的格。`World.walls` 是这一帧读到的全部墙格（一组 `Cell`）。\n\n**按结构认，不按色号认**（同一个色号这一关是墙、那一关是危险花纹）：\n整格一种纯色、且那个色是这一关左右两半的**主色**之一；或者整格混着几种色\n（两半接缝处）。解析那一侧的读法写在 `objects/parse.py`。\n\n块走向墙：那一块原地不动（另一块照走）。","field":"walls","py":"objects/terrain/wall.py","ablation":464,"why":"对象 walls（墙格）　—— 卡 02 首版；卡 06：欠账结清——消融 464 处，与 hazards 不合（规则里两支），判决：留（见 字段-walls.txt）\n\n1. 它记的是什么：这一帧读到的全部墙格。一关之内不变。\n2. 哪几条规则读它：所有移动规则（撞墙原地不动）、push_door（记号推不进墙）、\n   mirror_pair_persists（通行图对称）、terrain_static（墙是死的）。\n3. 抹成常量：待跑（卡 06）。\n4. 分离表：两张表都分不开。原因明白：墙在一关之内不变，换关的时候**所有**字段一起变，\n   语料里找不到「只差墙」的一对世界。这是第三种「分不开」——**这批语料分不开它**：\n   要分开它得有一关只在一格墙上不同，语料里没有这种关。\n\n处置：留着，进欠账（缺：消融读数——抹掉它，撞墙那几十步的判决会不会翻）。\n它和 hazards、size 同生共死（都是「这是哪一关」的函数）；合不合要看规则是不是总同时读它们（卡 06）。\n","abl_notes":"必要。读者：pieces_move、lit_arrows_push_marker（经 derive/passable）、terrain_static、\nmirror_pair_persists（通行图对称）、derive/grid（格阵大小 = 墙的外接框，卡 03 删 size 之后它多担一件事）。\n分离表分不开是**语料分不开**（一关之内不变，换关时全体一起变）；消融 464 处把「没人用」排除了。\n和 hazards 合不合：规则读它们走两支（墙 → 原地不动；危险 → 整关重来），合了那一支就没了——不合。","lean":"Obj/Terrain/Wall.lean"},{"name":"world","group":"","doc":"这一帧读得到的全部状态。","docstring":"`World` —— 这一帧**读得到的**全部状态。字段就是这一局的对象。\n\n每个字段都要回答判据 2：去掉它，找不找得出一对世界，原来能区分、现在无论如何都区分不了？\n那一对写在 `analysis/<对象>.txt`；分离表（`ledger/field_split.py`）替它找见证。\n\n**帧上读不出来的不进来**，三样，写在明处：\n  · 哪一块是 direct（两块同色同形）；\n  · 块底下盖着什么（整格都是块色）；\n  · 开着的门在哪（开着的门和地面一模一样）。\n规则要对这三样的每一种可能都说得通；形式化那一侧把第二、三样从「整关拼起来的盘」里补回来，\n第一样当成一位要从纤维里挑的隐藏信息。","field":null,"py":"objects/world.py","ablation":null,"why":"","abl_notes":"","lean":"Obj/World.lean"},{"name":"parse","group":"","doc":"帧 → 世界。**全局唯一碰像素的地方。** 上面每一层只认 `World` 的字段，读不到帧。","docstring":"帧 → 世界。**全局唯一碰像素的地方。** 上面每一层只认 `World` 的字段，读不到帧。\n\n## 量什么、怎么量（逐帧量，不写死）\n\n  · **格边长与原点**：从两块量。块色的像素恰好拼成两个同边长、对齐的方块，\n    总数 = 2·边长²；原点相位 = 块像素最小行 / 最小列对边长取模。\n    （第 0 关边长 5、第 1 关边长 4——写死的话换关那一刻静默失效。）\n  · **地形色**：格阵内非地面、非块色的像素，左右两半各自最多的那一种。\n    每关一条接缝把盘分成两半，两半用不同的墙色；同一个色号这一关是墙、那一关是危险花纹，\n    所以只认「这一关两半的主色」，不认色号。\n  · **计数带**：帧的第一行与最后一行上非地面色的像素数。它可能**画在格阵最后一行上**\n    （边长 5 的关，格阵覆盖到帧的最后一行），所以读格子时这两行一律让出去，\n    不然带子每长一格，底行那几格就被读成「混色 → 墙」。\n\n## 每一格读成什么（按花纹，不按色号）\n\n    整格地面色                                  → 地面\n    整格块色                                    → 块（底下是什么读不出来）\n    地面色 + 另一色棋盘交错、占满一种奇偶        → 危险格\n    一圈一格宽的地面色边框 + 中心一小块纯色      → 记号（中心是点亮色 = 被选中）\n    整格一种纯色，色是这一关两半主色之一         → 墙\n    整格一种纯色，色不是地面 / 块 / 两半主色      → 物件格（四邻有同色 → 门，否则 → 开关）\n    其余（接缝处的混色）                         → 墙\n\n## 良构检查：同一个量的两种读法必须对得上，对不上就抛\n\n  W1  块色像素数 = 2·边长²，且恰好拼成两个对齐方块（两种读法：计数 / 找方块）\n  W2  两块同色\n  W3  「两块是选中色」⇔「恰好一个记号中心是点亮色」；点亮的记号至多一个\n  W4  顶行带长 = 底行带长\n\n这四条都是「同一位信息的两处读法」，**不是一次观察**：\n没有一条写成「这一局恰好几个记号 / 几扇门」那种话。\n\n## 读不出来要抛，别返回 None\n\n`ParseError` 只管抛，不管归类：「这一帧本来就不是局面（终局画面）」和\n「是局面但读不出来」从像素上分不开（没有块就量不出格阵），分得开的是 meta。\n归类在拿得到 meta 的那一层做（`run_rules.py`）。","field":null,"py":"objects/parse.py","ablation":null,"why":"","abl_notes":"","lean":null}],"object_groups":[{"dir":"action","title":"动作：一步的输入。**不是世界的状态**，所以不进 `World`，单独一组。","why":""},{"dir":"clock","title":"时钟：只随「这一关又过了一步」变的东西（计数带）。","why":"单独成组，因为它不和任何格点打交道：它不挡路、不被推、不被踩，\n只数步。"},{"dir":"device","title":"装置：**会被操作改变**、但不直接听方向键的那几样（记号、选中、开关、门）。","why":"分成一组的理由：它们都是别的事牵着变的——记号要先被点中才会被推，\n门跟着开关上有没有块开合。它们也是这一局「制造不对称」的全部材料。"},{"dir":"geometry","title":"几何：格点坐标与位移（格阵大小 `Size` 卡 03 删了：它恒等于墙的外接框）。**这一组里没有任何世界断言**——","why":"它们只说「第几行第几列」「挪了几格」，不说「那一格是墙」。\n分成一组的理由就是这一句：它们在任何一关都是同一个意思。"},{"dir":"mover","title":"会被方向键搬动的东西：两块。","why":"单独成组，因为它们是这一局里**唯一**直接听方向键的对象；\n别的会变的东西（记号、门、计数带）都是被别的事牵着变的。"},{"dir":"terrain","title":"地形：**一关之内不会变**的那几样（墙、危险格）。","why":"分成一组的理由：它们只由这一关是哪一关决定，任何一步都改不了它们。\n形式化那一侧因此把它们住进 `Board`，而 `Board` 不是状态的字段——\n「走一步地形不会变」在那边不用证，它表示不出来。"}],"mutants":[{"name":"seed_上下对调","file":"objects/parse.py","why":"**种下的必红突变体**：ACTION1 的   // 文档里那点记号（**粗** / `代码` / 空行分段）换成 HTML。只是排版。
  Render.mdBlock = function (text) {
    const paras = String(text || "").split(/\n\s*\n/);
    return paras.map((p) => "<p>" + esc(p)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\n/g, "<br>") + "</p>").join("");
  };

  // 一格一个字符（导出器定的写法）→ 颜色。**这张表是配色，不是判断。**
  const FILL = {

      const ch = f.c[i], x = (i % f.k) * px, y = Math.floor(i / f.k) * px;
      let fill = FILL[ch] || "var(--unknown)";
      const ti = TINT.indexOf(ch) >= 0 ? TINT.indexOf(ch) : GATE.indexOf(ch);
      if (ti >= 0) fill = T.palette[f.t[ti]] || "var(--unknown)";
      if (ch === "p" && lit) fill = "var(--piece-dim)";
      out += `<rect x="${x}" y="${y}" width="${px}" height="${px}" fill="${fill}" stroke="var(--floor-line)" stroke-width="0.5"/>`;
      if (ch === "x") out += `<path d="M${x} ${y}L${x + px} ${y + px}M${x + px} ${y}L${x} ${y + px}" stroke="var(--hazard-2)" stroke-width="1"/>`;
      if (ch >= "A" && ch <= "H") out += `<rect x="${x + 2}" y="${y + 2}" width="${px - 4}" height="${px - 4}" fill="none" stroke="var(--wall)" stroke-width="2"/>`;
      if (ch >= "a" && ch <= "h") out += `<circle cx="${x + px / 2}" cy="${y + px / 2}" r="${px / 4}" fill="var(--wall)"/>`;
      if (ch === "m" || ch === "M") out += `<rect x="${x + px / 3}" y="${y + px / 3}" width="${px / 3}" height="${px / 3}" fill="var(--wall)"/>`;
      if (hi.has(i)) out += `<rect x="${x + 1}" y="${y + 1}" width="${px - 2}" height="${px - 2}" fill="none" stroke="var(--changed)" stroke-width="2"/>`;
    }
    out += "</svg>";
    const cap = opts.caption ? `<figcaption>${esc(opts.caption)}</figcaption>` : "";
    return `<figure class="board" style="margin:0">${cap}${out}<div class="note">计数带 ${f.b}</div></figure>`;
  };

  Render.chip = function (v) {
    const cls = { T: "TRUE", F: "FALSE", N: "NA", U: "NA", y: "TRUE", n: "FALSE", a: "NA" }[v] || "NA";
    const word = { T: "对", F: "错", N: "不管", U: "读不成", y: "对上", n: "判错", a: "闭嘴" }[v] || "—";
    return `<span class="chip ${cls}">${word}</span>`;
  };

  // 一条真实转移：前后两帧 + 每条规则说了什么。
  Render.row = function (i) {
    const T = window.TRACE, D = window.DATA;
    const r = T.steps[i];
    const names = D.rule_names;
    let tbl = '<table><tr><th>规则</th><th>它这一步说什么</th></tr>';
    for (let k = 0; k < names.length; k++) {
      tbl += `<tr><td class="mono"><a href="${window.UP || ""}rules/${names[k]}.html">${names[k]}</a></td><td>${Render.chip(r.v[k])}</td></tr>`;
    }
    tbl += `<tr><td>Lean 模型（按纤维判）</td><td>${r.lean ? Render.chip(r.lean) : '<span class="chip NA">不进逐条那一层</span>'}</td></tr></table>`;
    const head = `<div class="note">第 ${r.i} 行 · seq ${r.seq} · 上游步号 ${r.step} · 第 ${r.lv} 关 · 这一关第 ${r.m} 步 · 动作 <code>${esc(r.act)}</code>`
      + (r.up ? " · <b>这一步换关</b>" : "") + (r.cert ? " · 认证段" : " · 探索段（不当见证）") + `</div>`;
    return head + `<div class="boards" style="margin:10px 0">`
      + Render.board(r.p, { caption: "这一步之前", hi: r.chg })
      + Render.board(r.up ? r.n : r.n, { caption: r.up ? "下一帧（已是下一关的盘 / 终局画面）" : "这一步之后（黄框 = 变了的格）", hi: r.up ? [] : r.chg })
      + `</div>` + tbl;
  };

  function initReplay() {
    const box = document.getElementById("replay");
    if (!box) return;
    const T = window.TRACE;
    const slider = document.getElementById("slider");
    slider.max = T.steps.length - 1;
    const show = () => { box.innerHTML = Render.row(+slider.value); document.getElementById("pos").textContent = slider.value; };
    slider.oninput = show;
    document.getElementById("prevbtn").onclick = () => { slider.value = Math.max(0, +slider.value - 1); show(); };
    document.getElementById("nextbtn").onclick = () => { slider.value = Math.min(T.steps.length - 1, +slider.value + 1); show(); };
    const jump = document.getElementById("jump");
    if (jump) jump.onchange = () => { slider.value = jump.value; show(); };
    const q = +(location.hash || "#0").slice(1);
    slider.value = isNaN(q) ? 0 : q;
    show();
  }

  // 首页 / 规则页上那几张图：步号是导出器挑的，页面只按号去画。
  function initShots() {
    document.querySelectorAll("[data-row]").forEach((el) => {
      const i = +el.getAttribute("data-row");
      const T = window.TRACE;
      if (!T || isNaN(i)) return;
      const r = T.steps[i];
      const which = el.getAttribute("data-which") || "both";
      let h = "";
      if (which !== "next") h += Render.board(r.p, { caption: el.getAttribute("data-cap-prev") || "之前", hi: r.up ? [] : r.chg, px: 12 });
      if (which !== "prev") h += Render.board(r.n, { caption: el.getAttribute("data-cap-next") || "之后", hi: r.up ? [] : r.chg, px: 12 });
      el.innerHTML = `<div class="boards">${h}</div><div class="note">第 ${r.i} 行 · 第 ${r.lv} 关 · <code>${esc(r.act)}</code> · <a href="${window.UP || ""}replay.html#${r.i}">在回放里看</a></div>`;
    });
  }

  document.addEventListener("DOMContentLoaded", () => { initReplay(); initShots(); });
})();

</script>

<script>
// **形式化那一层页面。** 形状照 `ledger/templates/web/lean.js`：按角色分组的下拉、拆页的段横条、
// 公理表大纲、源码上色。这里没有一行世界逻辑——每一个数、每一段源码都是 `web/export.py` 导出来的。

const R = window.Render;
const $ = (id) => document.getElementById(id);

const KEY = ("theorem|def|abbrev|structure|inductive|instance|namespace|end|import|deriving|" +
  "by|fun|match|with|let|have|show|if|then|else|do|where|from|at|using").split("|");

const TAC = ("simp|omega|decide|rfl|exact|intro|intros|cases|rcases|obtain|refine|constructor|" +
  "rintro|induction|split|rw|apply|unfold|absurd|first|next|subst|injection|contradiction|generalize").split("|");

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 哨兵写成 \uXXXX 转义，不写裸控制字节（模板踩过的坑，别改回去）。给源码上色：只认注释、字符串和几十个词。
function paint(src) {
  let h = esc(src);
  h = h.replace(/\/-[\s\S]*?-\//g, (m) => `\u0001${m}\u0002`);
  h = h.replace(/--[^\n]*/g, (m) => `\u0001${m}\u0002`);
  h = h.replace(/&quot;[^\n]*?&quot;/g, (m) => `\u0003${m}\u0004`);
  h = h.replace(/(^|[^\w'])(#print|#eval)\b/g, (m, a, b) => `${a}\u0005${b}\u0006`);
  const kw = new RegExp("(^|[^\\w'.])(" + KEY.join("|") + ")(?![\\w'])", "g");
  h = h.replace(kw, (m, a, b) => `${a}\u0007${b}\u0008`);
  const tc = new RegExp("(^|[^\\w'.])(" + TAC.join("|") + ")(?![\\w'])", "g");
  h = h.replace(tc, (m, a, b) => `${a}\u000b${b}\u000c`);
  return h
    .replace(/\u0001/g, '<i class="c">').replace(/\u0002/g, "</i>")
    .replace(/\u0003/g, '<i class="s">').replace(/\u0004/g, "</i>")
    .replace(/\u0005/g, '<i class="p">').replace(/\u0006/g, "</i>")
    .replace(/\u0007/g, '<i class="k">').replace(/\u0008/g, "</i>")
    .replace(/\u000b/g, '<i class="t">').replace(/\u000c/g, "</i>");
}

// 公理表干不干净。**空的不算干净，算「没人核过」。**
function axChip(a) {
  if (!a) return '<span class="chip NA">没打公理表</span>';
  const dirty = a.indexOf("sorryAx") >= 0 || a.indexOf("ofReduceBool") >= 0;
  return `<span class="chip ${dirty ? "FALSE" : "TRUE"}">${esc(a)}</span>`;
}

function outlineHTML(f) {
  const out = [];
  for (const it of f.outline) {
    const thm = it.kind === "theorem";
    out.push(
      `<div class="litem${thm ? " thm" : ""}">` +
      `<div class="lhead"><span class="lkind">${it.kind}</span>` +
      `<span class="mono lname">${esc(it.name)}</span>` +
      (thm ? axChip(it.axioms) : "") + "</div>" +
      (it.doc ? `<div class="ldoc">${R.mdBlock(it.doc)}</div>` : "") +
      "</div>");
  }
  return out.join("\n") || '<div class="note">这一份里没有定义也没有定理（见文件头的理由）。</div>';
}

// 下拉：按角色分组（角色是 export.py 给的那一列，页面不自己判），留一组「没归类」兜底。
const NAV_GROUPS = [
  ["对象", ["对象"]],
  ["规则", ["规则"]],
  ["推论", ["推论"]],
  ["模型面对现实（判据 / 轨迹 / 语料）", ["观测"]],
  ["要证的东西", ["证明"]],
  ["装配与破坏测试", ["装配：只做分发", "破坏测试：应当编不过"]],
];

function flat(name) { return name.replace(".lean", "").replace(/\//g, "-"); }

function navHTML(name) {
  const files = window.DATA.lean.files;
  const used = new Set();
  let opts = "";
  const add = (x) => {
    used.add(x.name);
    opts += `<option value="${flat(x.name)}.html"${x.name === name ? " selected" : ""}>${esc(x.name)} —— ${esc(x.title)}</option>`;
  };
  for (const [gname, roles] of NAV_GROUPS) {
    const xs = files.filter((x) => roles.includes(x.role));
    if (!xs.length) continue;
    opts += `<optgroup label="${gname}">`;
    xs.forEach(add);
    opts += "</optgroup>";
  }
  const rest = files.filter((x) => !used.has(x.name));
  if (rest.length) {
    opts += `<optgroup label="没归类（${rest.length} 份）">`;
    rest.forEach(add);
    opts += "</optgroup>";
  }
  return `<label class="picker"><span>这 ${files.length} 份 Lean</span>`
       + `<select onchange="if(this.value)location.href=this.value">${opts}</select></label>`
       + `　<a href="index.html">回形式化首页</a>`;
}

function partsBar(f, here) {
  if (!f.parts || !f.parts.length) return "";
  const items = f.parts.map((p) => p.key === here
    ? `<span style="color:var(--dim)">${esc(p.title)}</span>`
    : `<a href="${flat(f.name)}-${p.key}.html">${esc(p.title)}</a>`);
  const whole = here === null
    ? `<span style="color:var(--dim)">整份</span>`
    : `<a href="${flat(f.name)}.html">整份</a>`;
  return `<div class="partsbar">${whole}${items.map((x) => "　" + x).join("")}</div>`;
}

function fileOf(name) { return window.DATA.lean.files.find((x) => x.name === name); }

function initFile() {
  const f = fileOf(window.LEAN_NAME);
  $("nav").innerHTML = navHTML(f.name) + partsBar(f, null);
  $("outline").innerHTML = outlineHTML(f);
  $("src").innerHTML = paint(window.LEANSRC.source);
}

function initPart() {
  const f = fileOf(window.LEAN_NAME);
  $("nav").innerHTML = navHTML(f.name) + partsBar(f, window.LEAN_PART);
  const p = window.LEANSRC.parts.find((x) => x.key === window.LEAN_PART);
  $("src").innerHTML = paint(p.source);
}

function initIndex() {
  const n = $("nav");
  if (n) n.innerHTML = navHTML(null);
}

// 对象页 / 规则页底下附着的那一份 Lean：只上色，不要下拉。
function initEmbed() {
  if (window.LEANSRC && $("src")) $("src").innerHTML = paint(window.LEANSRC.source);
}

document.addEventListener("DOMContentLoaded",
  () => (window.LEAN_EMBED ? initEmbed()
       : window.LEAN_PART ? initPart() : window.LEAN_NAME ? initFile() : initIndex()));

</script>
