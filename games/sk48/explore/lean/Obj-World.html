:root {

  --ink: #e8eaf0;  --dim: #8b93a7;  --faint: #5a6275;

     以及一个不透明的 id（只许判相等）。名字换成本局的，个数随本局。
     下面这一组是某一局的样子，留着当个例子： */
  --floor: #262b36;  --floor-line: #313846;
  --hazard: #6b2233; --hazard-2: #8d2c42;
  --wall: #0b0d12;
  --unknown: #1d212a;
  --piece: #59b0ff;  --piece-dim: #3a6c9e;
  --marker: #c9a227; --marker-on: #ffd84d;
  /* ↑↑↑ 本局专属到此为止 ↑↑↑ */

  --ok: #4caf7d;  --bad: #e5544b;  --na: #4a5163;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.6 "Segoe UI", system-ui, -apple-system, "Noto Sans SC", sans-serif;
}
a { color: #7ab8ff; text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 64px; }
header { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 20px; }
header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: .3px; }
header .sub { color: var(--dim); font-size: 13px; }
header nav { margin-top: 10px; display: flex; gap: 16px; font-size: 13px; }

/* **一行一张卡。** 原来是 1fr + 380px 两栏，于是「说得更细一点」和
   「为什么删不掉它」「它的 Lean」挤在同一行里，哪一段是哪一段看不出来。 */
.cols { display: block; }
.cols > div + div { margin-top: 16px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }

.card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--dim);
           text-transform: uppercase; letter-spacing: .8px; }

.board figcaption { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
svg.grid { display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }

.controls { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; flex-wrap: wrap; }
button { background: #232834; color: var(--ink); border: 1px solid var(--line);
         border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
button:hover { background: #2c3340; }
button:disabled { opacity: .4; cursor: default; }
input[type=range] { flex: 1; min-width: 180px; accent-color: #59b0ff; }
.step-label { color: var(--dim); font-size: 13px; min-width: 190px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--dim); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.chip { display: inline-block; min-width: 46px; text-align: center; padding: 1px 7px;
        border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .4px; }
.chip.TRUE { background: rgba(76,175,125,.16); color: var(--ok); }
.chip.FALSE { background: rgba(229,84,75,.18); color: var(--bad); }
.chip.NA { background: #222732; color: var(--faint); }

.why { color: var(--dim); font-size: 12px; }
.kv { display: grid; grid-template-columns: 116px 1fr; gap: 3px 10px; font-size: 13px; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; }

.legend { display: flex; flex-wrap: wrap; gap: 12px 18px; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
            vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); }

.note { color: var(--dim); font-size: 12.5px; }
.note strong { color: var(--ink); }
pre.doc { white-space: pre-wrap; font-size: 13px; line-height: 1.65; margin: 0;
          font-family: inherit; }
pre.doc b { color: #ffd88a; font-weight: 600; }
ul.tight { margin: 6px 0 0; padding-left: 18px; }
ul.tight li { margin: 3px 0; }

.rulelist { display: grid; gap: 10px; }
.rulelist a.row { display: grid; grid-template-columns: 210px 1fr auto; gap: 14px;
                  padding: 11px 14px; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 8px; color: var(--ink); }
.rulelist a.row:hover { border-color: #3c4658; text-decoration: none; }
.rulelist .nm { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #7ab8ff; }
.rulelist .cl { color: var(--dim); font-size: 13px; }

/* 规则文档的排版 */
#doc h3 { font-size: 13.5px; margin: 20px 0 8px; color: #ffd88a; font-weight: 600; }
#doc h3:first-child { margin-top: 0; }

#doc p:first-child { margin-top: 0; }

/* 每页最上面那一段人话 + 图 */
.hero { background: linear-gradient(180deg, #1c2330, #1a1d25);

td.ok, .ok { color: var(--ok); }

.lsec { font-size: 12px; margin: 22px 0 10px; color: #ffd88a; font-weight: 600;

.scene-words b { color: #ffd88a; }

.scene details { margin-top: 14px; }
.scene summary { cursor: pointer; color: var(--dim); font-size: 12.5px; padding: 4px 0; }
.scene summary:hover { color: var(--ink); }

.navsep { color: #3a4152; margin: 0 .35em 0 .15em; user-select: none }

<script>window.DATA={"game":"sk48","palette":["#ffffff","#cccccc","#999999","#666666","#333333","#000000","#e53aa3","#ff7bcc","#f93c31","#1e93ff","#88d8f1","#ffdc00","#ff851b","#921231","#4fcc30","#a356d6"],"meta":{"rows":1407,"uniq":1003,"frames":2814,"readable":2811,"parse_a":3,"parse_b":0,"parse_a_criterion":"meta 说这一帧是 WIN（终局画面）","parse_a_list":[[1143,"next"],[1144,"prev"],[1407,"next"]],"marks":{"reset":8,"levelup":28,"win_frame":3},"E_total":0,"gap":0,"reset_inlevel":5,"reset_to_opening":5,"mut_total":120,"mut_rejected":116,"mut_by_parse":24},"corpus":{"trace":"runs/sk48-0908-0719/transitions.jsonl","rows":1407,"uniq":1003,"segments":[{"seg":"01c49132-5a97-4580-807d-fdab6c796a97","seq_lo":1,"seq_hi":176,"n":176,"max_level":4,"certified":false,"resets":1,"rows_per_level":{"0":49,"1":28,"2":42,"3":45,"4":11}},{"seg":"9667bc66-34e5-41d9-bb58-944a44aade8b","seq_lo":177,"seq_hi":495,"n":319,"max_level":5,"certified":false,"resets":2,"rows_per_level":{"0":49,"1":28,"2":42,"3":45,"4":149,"5":4}},{"seg":"379b32a2-1a82-47a1-8b1a-a3e00cd59df8","seq_lo":496,"seq_hi":1143,"n":648,"max_level":8,"certified":false,"resets":4,"rows_per_level":{"0":49,"1":28,"2":42,"3":45,"4":198,"5":112,"6":98,"7":72}},{"seg":"04d2f7e8-eff7-48fb-b6ed-6831e25b3687","seq_lo":1144,"seq_hi":1407,"n":264,"max_level":8,"certified":true,"resets":1,"rows_per_level":{"0":14,"1":30,"2":33,"3":29,"4":41,"5":43,"6":27,"7":46}}],"marks":{"reset":8,"levelup":28,"win_frame":3},"reconciled":true,"certified_level_actions":[14,30,33,29,41,43,27,46]},"groups":{"objects":[{"key":"action","doc":"**动作**：API 发出去的那一串字（`ACTION1` / `ACTION6:x,y` / `RESET` …）读成什么。\n\n它不是世界的一部分，但要进对象层，理由只有一条：`ACTION6` 带的是**像素坐标**，\n而像素只许在 `parse.py` 里碰。于是「点中了谁」在解析那一层就认好，\n上面每一层拿到的是 `Act`（点中的是哪个记号，或者谁也没点中），不再见像素。"},{"key":"board","doc":"**版面**：一关之内不会变的那半边世界。\n\n这一组里的东西，任何一个动作都改不了它们（`rule/说了但不进模型/board_static.py` 在全部语料上核这一句）。\n分成一组的理由：到了形式化那一层，它们住进 `Board`，而 `Board` **不是状态的字段**——\n`step` 碰都碰不到它，于是「走一步版面不会变」不用证，它**表示不出来**。\n\n    board    版面本身：下面几样收成一样东西（`World.board`）\n    grid     棋盘几行几列\n    rail     两条轨各自铺到哪（横玩家能走的格行 / 竖玩家能走的格列）\n    goal     示意图：每根绳子该按什么顺序串哪几种颜色\n    deadrope 死绳：没有主人、永远不动的竖绳（卡 06 从 `pieces/` 搬来）\n    （墙是一组格子，直接是 `frozenset[Cell]`，没有单独的类）"},{"key":"geometry","doc":"几何：格坐标。**这一类里没有任何世界断言**——\n\n它只说「第几行第几列」，不说「那一格是墙」。\n分成一个子文件夹的理由就是这一句：它在任何一局都是同一个意思。"},{"key":"pieces","doc":"**盘上的东西**：一关之内会被动作改动的那半边世界。\n\n    block      靶块：一格一个，带一种颜色\n    hplayer    横玩家：挂在左边竖轨上，往右伸一根横绳\n    vplayer    竖玩家：挂在上边横轨上，往下伸一根竖绳\n\n分成一组的理由：`step` 改的正是这一组，别的它碰不到。\n（死绳原来也在这一组，卡 06 搬去了 `board/`：它一关之内从不动。）"},{"key":"(根)","doc":"唯一碰像素的那一份，和这一局的全部状态。"},{"key":"derive","doc":"**复合概念**：由 `objects/` 里的对象算出来的量。\n\n和 `objects/` 的分界是一句话：**对象是世界的状态，`derive` 是从状态算出来的量。**\n这里的东西同样不许碰像素——输入是 `World`，不是帧。\n\n    beads       一根绳盖住哪几格、串着哪几颗靶（按从绳主往外的顺序）、示意图的每个槽对上没有、赢了没有"}],"rules":[{"key":"一步怎么走","doc":"**这一组管：按一个方向键 / 点一下之后，谁动、动到哪。**\n\n方向键只作用在**被选中**的那个玩家身上。四个键对它是什么意思，只看键和它那根绳的朝向：\n\n    沿绳的键（横玩家 左/右，竖玩家 上/下）      绳缩 / 伸一格            rope_slide\n    垂直于绳的键（横玩家 上/下，竖玩家 左/右）  整根杆平移一格          pole_sweep\n    点击                                        换选中                   click_select\n\n（竖玩家就是横玩家转 90 度，这个对称提成了 `derive/line.py`，于是每件事只说一遍。）\n\n**论域天然错开**：同一条转移只落进一条规则（动作 × 朝向 两个维度切开），\n而每条规则主张的是**整个下一帧世界**（底条除外），不只是它关心的那几样——\n所以「没被选中的不动」「版面不变」这些框架条件也在它的主张里，不另立一条。\n\n过关那一步（下一帧已经是另一张盘）、RESET、ACTION7 一律不归这一组。"},{"key":"什么算赢","doc":"**这一组管：这一步过没过关。**\n\n赢是一个**状态性质**（每根绳都串对了），不是一个转移事件——\n写成事件的话，没有任何一个状态是目标，「这个局面可不可做」就无从问起。\n\n过关那一步的下一帧已经是下一关的盘，拿它判不了「这一步走完之后串对没有」，\n所以过关那一支要用「一步怎么走」那一组**算出来**的下一帧；没过关那一支直接看观测到的下一帧。"},{"key":"说了但不进模型","doc":"**这一组管：写出来了、在语料上判、但明说不进 Lean 模型的说法。**\n\n每一条都要写**为什么不进模型**，并且固定打两个数：\n\n    论域条数     语料里有多少条转移落在它管的范围里\n    被驳倒几次   其中有多少条和它对不上\n\n论域是 0 照样判红：一条谁也管不着的假设，和一条从没被驳倒的假设，读数上必须分得开。\n不进模型的共同原因只有一个：**它依赖一位帧上读不出来的信息**（历史、隐藏的朝向、时钟相位），\n硬塞一个字段进世界，就是给模型加一位帧上没有的信息。"}]},"objects":[{"name":"Act","file":"objects/action/act.py","group":"action","doc":"`Act` —— 一步动作，读成这一局的词。\n\n    kind    'up' / 'down' / 'left' / 'right' / 'a7' / 'click' / 'reset'\n            （ACTION1..4 各自对应 up/down/left/right —— 这只是名字，\n             它们对横玩家、竖玩家各是什么意思，归规则层说）\n    target  只对 click 有意义：点中的那个精灵的记号；点在别处是 None\n\n**点中的判法在解析里**（`parse_action`）：像素落在某个精灵的 6×6 外框里算点中它。\n语料里的点击全部落在精灵正中或空白处，「点在外框边上算不算」没被检验过——写在欠账里。","cdoc":"一步动作。","why":"","ablation":null,"lean":"Obj/Action/Act.lean"},{"name":"Board","file":"objects/board/board.py","group":"board","doc":"`Board` —— **版面**：一关之内不会变的那半边世界，收成一样东西。\n\n    grid    棋盘几行几列\n    walls   墙占的格（`frozenset[Cell]`）\n    hrail   左边竖轨：横玩家能停的格行范围（没有横玩家时 None）\n    vrail   上边横轨：竖玩家能停的格列范围（没有竖玩家时 None）\n    goals   示意图：每根绳该串成的颜色序列\n    deadropes  死绳（卡 06 搬进来的，见 `deadrope.py`）\n\n## 为什么是一样东西，不是五个字段（卡 03 那一刀：合）\n\n分离表上这五个字段**一个都单独分不开**，而且是同一个原因：它们只在换关时变、\n一变就一起变（全部语料逐关核过：每一关里五个字段各只取一个值）。\n那是「同生共死」——它们是**这一关的版面**这一件事的五个部件。\n\n合成一样东西之后，到了形式化那一层它住进 `Board`，而 `Board` **不是状态的字段**：\n`step` 碰不到它，「走一步版面不会变」于是不用证，**它表示不出来**。\n\n合并不是删除：五个部件每一个都还在，规则照旧逐个读它们\n（墙挡绳、格数定边界、轨定能走到哪、示意图定什么算赢）。","cdoc":"一关的版面。","why":"board（版面：格数 / 墙 / 两条轨 / 示意图 / 死绳）—— 为什么删不掉\n\n1. 它记的是什么：这一关不会变的那一半。\n2. 谁读它：rope_slide（格数定绳能伸多长、墙挡绳、死绳当钉子）、pole_sweep（格数、轨限位、墙挡杆）、\n   win_iff_threaded（示意图定什么算赢，死绳的串也要对）、reset_restart 与 a7_one_step（主张「版面不变」）。\n3. 抹成常量（真跑，装置消融，分母 320 条 = 真实抽样 + 变异）：卡 06 那一轮 135 处判决变了。\n4. 分离表：卡 02 / 03 时「分不开」（五个部件只在换关时一起变），卡 06 把死绳并进来之后「分得开」：\n   见证是第 1 关与第 2 关各一帧（seq 1182 next / seq 1212 next）：靶、横玩家、选中、底条全同，\n   只差第 2 关多了一根死绳（格列 3、长 4）——那根死绳把那一列的靶钉住、而且示意图点名要它串的东西。\n   三个读数对得上：有读者、消融变、分得开。\n\n卡 03 那一刀（五个字段合成一个）在卡 06 重量过：五个部件各自仍被规则读（墙 / 轨 / 格数 / 示意图），\n合并没有抹掉任何一位信息，只是换了住处——所以这一刀没砍错。\n","ablation":820,"lean":"Obj/Board/Board.lean"},{"name":"DeadRope","file":"objects/board/deadrope.py","group":"board","doc":"`DeadRope` —— 死绳：从盘顶垂下、**没有主人**的竖绳。\n\n    owner   绳头那个 2×2 小块的颜色（示意图里用它点名这根绳）\n    col     它占的格列\n    length  它盖住格行 0 .. length-1\n\n和 `VPlayer` 的区别只有一条：**没有精灵，谁也选不中它，所以它永远不动**。\n它仍然是一根绳：串在它上面的靶要按示意图的顺序排好，它也把那一列钉住。\n\n## 为什么住在 `board/`（卡 06 那一刀）\n\n卡 02 时它在 `pieces/`（会动的那一组），是 `World` 的一个独立字段。\n卡 06 重取读数：全部语料里每一关它都只取一个值（一关之内从不变），规则只拿它当钉子和示意图的点名对象读。\n于是它搬进版面（`Board.deadropes`）：「死绳永远不动」从一句要每帧核的话，变成**表示不出来**的事。","cdoc":"死绳。","why":"","ablation":null,"lean":"Obj/Board/DeadRope.lean"},{"name":"Goal","file":"objects/board/goal.py","group":"board","doc":"`Goal` —— 示意图里的一组：**哪根绳**，该按什么顺序串**哪几种颜色**。\n\n帧上的样子：底条下面那一带，一个 6×6 的小图标开一组，它右边跟着几个 4×4 色块。\n图标正中 2×2 的颜色指的是盘上哪根绳的主人（横玩家 / 竖玩家精灵的芯色，或者死绳头的颜色）。\n\n    owner    不透明的记号，**只许判相等**：拿它去和盘上各根绳主人的记号比\n    colors   从绳主往外数，第 j 颗应当是什么颜色（也是不透明记号，只和靶的颜色比相等）\n\n「串对了」的读法（第 j 颗 = 第 j 个色）在 `derive/beads.py`；\n示意图上每个槽还会被「挖空」，那是同一件事在帧上的**第二种读法**，\n解析拿两种读法互相核（见 `parse.py` 的良构检查）。","cdoc":"一根绳该串成的颜色序列。","why":"","ablation":null,"lean":"Obj/Board/Goal.lean"},{"name":"Grid","file":"objects/board/grid.py","group":"board","doc":"`Grid` —— 棋盘有几行几列格。\n\n每一关不同（语料里见过 5×5、7×7、7×8 …），一关之内不变。\n**它是量出来的，不是写死的**：解析从帧里认出棋盘那块底色的外接矩形，再除以格边。","cdoc":"棋盘尺寸（格）。","why":"","ablation":null,"lean":"Obj/Board/Grid.lean"},{"name":"Rail","file":"objects/board/rail.py","group":"board","doc":"`Rail` —— 一条轨铺到哪：一个闭区间 `[lo, hi]`。\n\n两条轨，意思对称：\n\n    左边竖轨   横玩家能停的**格行**范围（它上下走，出了这一段就走不动）\n    上边横轨   竖玩家能停的**格列**范围（它左右挪，出了这一段就挪不动）\n\n帧上的样子：每一格正中两像素是一种花纹色，格与格之间是另一种。玩家自己的精灵\n会把轨的一段盖住，所以解析时要把玩家所在那一格并进来。\n**轨是连续的一段**——解析里写成了良构检查：花纹带中间断了一截，这一帧读不成世界。","cdoc":"一条轨覆盖的格区间（闭区间）。","why":"","ablation":null,"lean":"Obj/Board/Rail.lean"},{"name":"Cell","file":"objects/geometry/cell.py","group":"geometry","doc":"`Cell` —— 棋盘上一格的坐标（格行, 格列），从 0 数起。\n\n## 判据 1：世界层不许出现像素\n\n一格占 6×6 像素是**解析**的事。`Cell(0, 0)` 是棋盘左上角那一格，不是帧的左上角：\n平移被商掉了，代价是一个 `Cell` 离开它的棋盘就没有意义——这是有意的。","cdoc":"棋盘格坐标。行在前、列在后。","why":"","ablation":null,"lean":"Obj/Geometry/Cell.lean"},{"name":"Block","file":"objects/pieces/block.py","group":"pieces","doc":"`Block` —— 一颗靶块：在哪一格、什么颜色。\n\n帧上：一格 6×6 里内缩一圈的 4×4 实心色块。**颜色是不透明记号**，只许判相等\n（拿它和示意图里要求的颜色比），不许比大小、不许当成「第几种」。\n一格至多一颗（解析按格读，天然如此）。","cdoc":"一颗靶。","why":"blocks（全部靶块：格 + 颜色）—— 为什么删不掉\n\n1. 它记的是什么：盘上每一颗靶在哪、什么色。\n2. 谁读它：rope_slide、pole_sweep（搬它）、win_iff_threaded（串上的颜色序列从它读）。\n3. 抹成常量：39 处判决变了（卡 03、卡 06 两轮同一个数）。\n4. 分离表：分得开，见证 world 21 / 91（seq 11 next / seq 46 next）：只差靶的位置。\n   没有它，「杆扫过去把靶带走」和「杆扫过去什么都没带」是同一个世界。\n","ablation":303,"lean":"Obj/Pieces/Block.lean"},{"name":"HPlayer","file":"objects/pieces/hplayer.py","group":"pieces","doc":"`HPlayer` —— 横玩家：挂在棋盘左边竖轨上的精灵，拖一根**往右**伸的横绳。\n\n    owner   它的记号（精灵正中 2×2 的颜色，不透明，只判相等）\n    row     它占的格行\n    rope    绳盖住那一行的格列 0 .. rope-1（0 = 一格都没伸进棋盘）\n\n**绳是一根杆**：它盖住的每一格上的靶都算「串在这根绳上」，\n从绳主往外（格列从小到大）读出来的颜色序列，拿去和示意图比。","cdoc":"横玩家。","why":"hplayer（横玩家：记号 / 格行 / 绳长）—— 为什么删不掉\n\n1. 它记的是什么：左边竖轨上那个玩家停在哪一格行、绳往右伸了几格。\n2. 谁读它：rope_slide / pole_sweep（它被选中时就是它在动；它没被选中时它的绳是竖绳的钉子）、\n   click_select（点中它换选中）、win_iff_threaded（它的绳串着什么）、a7_one_step、reset_restart。\n3. 抹成常量：164 处判决变了（六个字段里最多）。\n4. 分离表：分得开，见证第 0 / 1 帧（seq 1 prev / next）：按一下上键，只有它的格行变了。\n","ablation":1150,"lean":"Obj/Pieces/HPlayer.lean"},{"name":"VPlayer","file":"objects/pieces/vplayer.py","group":"pieces","doc":"`VPlayer` —— 竖玩家：挂在棋盘上边横轨上的精灵，拖一根**往下**伸的竖绳。\n\n    owner   它的记号（精灵正中 2×2 的颜色）\n    col     它占的格列\n    rope    绳盖住那一列的格行 0 .. rope-1\n\n它是 `HPlayer` 转 90 度：左右键让它沿横轨挪列，上下键让绳伸缩。","cdoc":"竖玩家。","why":"vplayers（竖玩家：记号 / 格列 / 绳长，按格列排）—— 为什么删不掉\n\n1. 它记的是什么：上边横轨上的玩家（只在第 5–7 关出现，每关一个）停在哪一格列、绳往下伸了几格。\n2. 谁读它：rope_slide / pole_sweep（它被选中时是它在动；它没被选中时它的绳是横绳的钉子）、click_select、win_iff_threaded。\n3. 抹成常量：52 处判决变了（卡 05 时 50）。\n4. 分离表：分得开，见证 world 987 / 989（seq 494 next / 495 next）：只差竖绳长度。\n\n语料说不了的：同一关里两个竖玩家（语料里每关至多一个）。类型允许多个，规则也按「别的每一根绳都是钉子」写，\n但这一支一次都没被检验过。\n","ablation":270,"lean":"Obj/Pieces/VPlayer.lean"},{"name":"World","file":"objects/world.py","group":"(根)","doc":"`World` —— 这一局一帧的**全部状态**。字段就是这一局的对象。\n\n每个字段为什么删不掉，写在 `analysis/<字段>.txt`（卡 02/03/06 三轮的读数都在那里）。\n这里只写它是什么。\n\n    board      版面：一关之内不变的那一半（格数 / 墙 / 两条轨 / 示意图 / 死绳），见 `board/board.py`\n    blocks     全部靶块\n    hplayer    横玩家（语料里每一关都恰好一个；None 只是为了让类型说得出「没有」）\n    vplayers   竖玩家，按格列排\n    selected   此刻方向键作用在谁身上（它的记号）\n    bar        底条已经走掉的格数。**它不进模型**（见 `rule/说了但不进模型/bar_clock.py`），\n               留在世界里是因为它确实在帧上、确实会变，删掉它就是假装帧上没有这一行。\n\n**上游已经给的事实不进 World**：第几关、这一局赢了没有，是 API 给的，规则要用就从 `ctx` 读。","cdoc":"一帧世界。","why":"selected（此刻方向键作用在谁身上：它的记号）—— 为什么删不掉\n\n1. 它记的是什么：被选中的那个玩家。帧上写了三遍（精灵的填充圈、绳的花纹相位、示意图图标的填充），解析拿它们互相核。\n2. 谁读它：rope_slide / pole_sweep（derive/line.py 的 Mover 从它起算：选中横玩家 ⇒ 左右是伸缩，选中竖玩家 ⇒ 上下是伸缩）、\n   click_select（点击改它）、a7_one_step（论域）、reset_restart（RESET 之后回到横玩家）。\n3. 抹成常量：88 处判决变了。\n4. 分离表：分得开，见证 world 981 / 987（seq 491 next / seq 494 next）：两帧只差选中的是谁\n   ——同样按一下「上」，一个是横玩家挪一行，一个是竖绳缩一格。\n\n\nbar（底条已走的格数）—— 为什么删不掉，又为什么不进模型\n\n1. 它记的是什么：帧下方那一整行花纹里已经走掉几格。\n2. 谁读它：只有 bar_clock 一条（方向键 +0/+1、点击与 ACTION7 不动、RESET 与过关归零）。\n   另外 lean2/export_levels.py 拿它当「现实那一侧重来了」的独立信号做交叉检查（它不进模型，所以它独立于模型）。\n3. 抹成常量：64 处判决变了——全部是 bar_clock 的。\n4. 分离表：分得开，见证第 0 / 7 帧：只差底条。\n\n不进模型的理由在 rule/说了但不进模型/bar_clock.py：方向键那一步是 +0 还是 +1 取决于这一关已经按了几下（历史）。\n**删掉它**等于假装帧上没有这一行；**放进模型**等于给模型加一位帧上读不出的历史。两样都不对，所以它留在世界里、不进 Lean 的状态。\n","ablation":null,"lean":"Obj/World.lean"},{"name":"parse","file":"objects/parse.py","group":"(根)","doc":"帧 → 世界。**全局唯一碰像素的地方。**\n\n上面每一层只认 `World` 的字段，读不到帧。\n\n## 这一局的帧长什么样（量出来的，不是猜的）\n\n    帧外底色       左上角那一像素的颜色\n    底条           一整行只由两种花纹色组成（已走 / 未走），它把帧分成上下两半\n    上半：棋盘     底条以上、除帧外底色之外**最多的那种颜色**的外接矩形；格边 6 像素\n          横玩家   棋盘左外侧的 6×6 精灵：外框 + 一圈填充 + 正中 2×2 的芯\n          竖玩家   棋盘上外侧的 6×6 精灵，同形\n          死绳头   棋盘上外侧、某一格列正中两像素上的 2×2 小块，四周是帧外底色（没有精灵框）\n          两条轨   棋盘左外侧第 4、3 列（竖轨）/ 上外侧第 4、3 行（横轨）的花纹带\n    下半：示意图   一个 6×6 图标开一组，右边跟着 4×4 色槽\n\n**按结构认，不按色号认**，只有两处例外，写在明处：\n\n    ROPE      绳的花纹只用这三种颜色（选中的绳 1/2，没选中的 2/3）。\n              读「这一格有没有绳」要一个调色板，结构认不出来——但下面有一道良构检查\n              拿「选中与否」核花纹的**相位**，调色板读错了那道检查会响。\n    格边 6    全部帧、全部关一样。\n\n## 良构检查：同一个量的两种读法必须对得上\n\n对不上就抛 `ParseError`，这一帧读不成世界（分母从转移变成帧）：\n\n  1. 棋盘外接矩形的高、宽都是格边的整数倍；\n  2. 每一格要么是墙（36 像素一色）、要么是靶（正中 4×4 一色）、要么是空格\n     （只剩棋盘底色和绳的花纹）——**第四种东西出现就是读不出来**；\n  3. 恰好一个精灵的填充圈不是棋盘底色（= 恰好一个被选中）；\n  4. **绳的花纹相位 = 主人选中与否**：同一件事（谁被选中）的第二种读法；\n  5. **示意图挖空的槽 = 那根绳上从绳主往外第 j 颗恰好是第 j 个色**：\n     「串对了没有」的第 <script>
// **画世界的那一份**：按本局的对象画格子。只有尺寸与配色，一行世界逻辑都没有。
//

(function () {

  // 色号 → 颜色只有一个来源：export.py 从官方 arc_agi.rendering.COLOR_MAP 取出写进 DATA.palette（下标 = 色号）。
  // 靶的色号和主人记号（精灵芯色）都是帧里的色号，查同一张表；这里不抄。
  const PALETTE = ((window.DATA || {}).palette || []).slice();
  const OWNER = PALETTE;

  function col(id, tbl) { return tbl[id] || "#9aa3b5"; }
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;"); }

  function board(b, w, opts) {
    opts = opts || {};
    const W = PAD + b.cols * CELL + 10;
    const Hh = PAD + b.rows * CELL + 12 + HUD;
    const o = [];
    const X = (c) => PAD + c * CELL;
    const Y = (r) => PAD + r * CELL;
    o.push(`<svg class="grid" width="${W}" height="${Hh}" viewBox="0 0 ${W} ${Hh}">`);
    // 两条轨
    if (b.hrail) o.push(`<rect x="${PAD - 12}" y="${Y(b.hrail[0]) + 6}" width="4" height="${(b.hrail[1] - b.hrail[0]) * CELL + CELL - 12}" fill="#3a4152"/>`);
    if (b.vrail) o.push(`<rect x="${X(b.vrail[0]) + 6}" y="${PAD - 12}" width="${(b.vrail[1] - b.vrail[0]) * CELL + CELL - 12}" height="4" fill="#3a4152"/>`);
    // 格
    for (let r = 0; r < b.rows; r++) {
      for (let c = 0; c < b.cols; c++) {
        o.push(`<rect x="${X(c)}" y="${Y(r)}" width="${CELL}" height="${CELL}" fill="var(--floor)" stroke="var(--floor-line)"/>`);
      }
    }
    for (const [r, c] of b.walls) o.push(`<rect x="${X(c)}" y="${Y(r)}" width="${CELL}" height="${CELL}" fill="var(--wall)"/>`);
    // 死绳：头在盘外上方，绳往下
    for (const [ow, c, n] of b.deadropes) {
      const x = X(c) + CELL / 2;
      o.push(`<rect x="${x - 4}" y="${PAD - 26}" width="8" height="8" fill="${col(ow, OWNER)}"/>`);
      if (n > 0) o.push(`<line x1="${x}" y1="${PAD - 16}" x2="${x}" y2="${Y(n) - 3}" stroke="${col(ow, OWNER)}" stroke-width="3" stroke-dasharray="4 3"/>`);
    }
    // 靶
    for (const [r, c, k] of w.blocks) {
      o.push(`<rect x="${X(c) + 4}" y="${Y(r) + 4}" width="${CELL - 8}" height="${CELL - 8}" rx="3" fill="${col(k, PALETTE)}"/>`);
    }
    // 横玩家与横绳
    if (w.hplayer) {
      const [ow, row, n] = w.hplayer;
      const y = Y(row) + CELL / 2;
      const sel = ow === w.selected;
      if (n > 0) o.push(`<line x1="${PAD - 4}" y1="${y}" x2="${X(n) - 3}" y2="${y}" stroke="${col(ow, OWNER)}" stroke-width="${sel ? 4 : 2.5}" opacity="${sel ? 1 : .6}"/>`);
      o.push(`<rect x="${PAD - 26}" y="${Y(row) + 3}" width="${CELL - 6}" height="${CELL - 6}" rx="4" fill="${sel ? col(ow, OWNER) : "none"}" stroke="${col(ow, OWNER)}" stroke-width="2"/>`);
    }
    // 竖玩家与竖绳
    for (const [ow, c, n] of w.vplayers) {
      const x = X(c) + CELL / 2;
      const sel = ow === w.selected;
      if (n > 0) o.push(`<line x1="${x}" y1="${PAD - 4}" x2="${x}" y2="${Y(n) - 3}" stroke="${col(ow, OWNER)}" stroke-width="${sel ? 4 : 2.5}" opacity="${sel ? 1 : .6}"/>`);
      o.push(`<rect x="${X(c) + 3}" y="${PAD - 26}" width="${CELL - 6}" height="${CELL - 6}" rx="4" fill="${sel ? col(ow, OWNER) : "none"}" stroke="${col(ow, OWNER)}" stroke-width="2"/>`);
    }
    // 这一步变了的格（导出侧算好的）
    for (const [r, c] of (opts.changed || [])) {
      o.push(`<rect x="${X(c) + 1}" y="${Y(r) + 1}" width="${CELL - 2}" height="${CELL - 2}" fill="none" stroke="#ffd84d" stroke-width="2"/>`);
    }
    // 示意图：每组一个主人记号，后面是要串的颜色；对上了的槽打勾（对没对上是导出侧算好的）
    let hx = 6;
    const hy = PAD + b.rows * CELL + 18;
    b.goals.forEach(([ow, cols], g) => {
      o.push(`<rect x="${hx}" y="${hy}" width="14" height="14" rx="3" fill="none" stroke="${col(ow, OWNER)}" stroke-width="2"/>`);
      hx += 20;
      cols.forEach((k, j) => {
        const ok = w.slots && w.slots[g] && w.slots[g][j];
        o.push(`<rect x="${hx}" y="${hy}" width="14" height="14" rx="2" fill="${col(k, PALETTE)}" opacity="${ok ? 1 : .45}"/>`);
        if (ok) o.push(`<text x="${hx + 3}" y="${hy + 11}" font-size="11" fill="#111">✓</text>`);
        hx += 17;
      });
      hx += 12;
    });
    o.push(`<text x="${W - 8}" y="${Hh - 6}" font-size="10" fill="#8b93a7" text-anchor="end">底条 ${w.bar}</text>`);
    o.push("</svg>");
    return o.join("");
  }

  // 极简的 Markdown：**粗体**、`代码`、空行分段。只排版，不理解。
  function mdBlock(s) {
    return String(s || "").split(/\n\s*\n/).map((p) => "<p>" + esc(p)
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\n/g, "<br>") + "</p>").join("");
  }

  window.Render = { board, mdBlock, PALETTE, OWNER };
})();

</script>
<script>
// **形式化那一层页面的骨架。跨局可搬的那几段都在这里。**
//
// 这一份从一局的 `web/lean.js` 里摘出来：留下的是**形状**
// （按角色分组的下拉、拆页的段横条、公理表大纲、源码上色），
// 拿掉的是那一局专属的东西（画盘面、语料读数表）。
//
// 一条不许破的：**这里没有一行世界逻辑。** 每一个数、每一个框都是
// `web/export.py` 在 Python 那边算好导出来的；这一份只摆数据、只画图形。
// `check_no_logic.py` 会来这里搜对象层的方法名，搜到就算破了。

const R = window.Render;
const $ = (id) => document.getElementById(id);

const KEY = ("theorem|def|abbrev|structure|inductive|instance|namespace|end|import|deriving|" +
  "by|fun|match|with|let|have|show|if|then|else|do|where|from|at|using").split("|");

const TAC = ("simp|omega|decide|rfl|exact|intro|intros|cases|rcases|obtain|refine|constructor|" +
  "rintro|induction|split|rw|apply|unfold|absurd|first|next").split("|");

function esc(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 哨兵用 \uXXXX **写成转义，不写裸控制字节**：裸字节在磁盘上能跑，
// 但一被任何会规范化控制字符的工具读一遍再写出来就没了，
// 而那时这几行正则会变成空正则、整页炸掉——**照抄这一份的人第一个撞上**。
// 给 Lean 源码上色。**这是渲染**：它不理解一个字，只认注释、字符串和几十个词。
function paint(src) {
  let h = esc(src);
  h = h.replace(/\/-[\s\S]*?-\//g, (m) => `\u0001${m}\u0002`);
  h = h.replace(/--[^\n]*/g, (m) => `\u0001${m}\u0002`);
  h = h.replace(/&quot;[^\n]*?&quot;/g, (m) => `\u0003${m}\u0004`);
  h = h.replace(/(^|[^\w'])(#print|#eval)\b/g, (m, a, b) => `${a}\u0005${b}\u0006`);
  const kw = new RegExp("(^|[^\\w'.])(" + KEY.join("|") + ")(?![\\w'])", "g");
  h = h.replace(kw, (m, a, b) => `${a}\u0007${b}\u0008`);
  const tc = new RegExp("(^|[^\\w'.])(" + TAC.join("|") + ")(?![\\w'])", "g");
  h = h.replace(tc, (m, a, b) => `${a}\u000b${b}\u000c`);
  return h
    .replace(/\u0001/g, '<i class="c">').replace(/\u0002/g, "</i>")
    .replace(/\u0003/g, '<i class="s">').replace(/\u0004/g, "</i>")
    .replace(/\u0005/g, '<i class="p">').replace(/\u0006/g, "</i>")
    .replace(/\u0007/g, '<i class="k">').replace(/\u0008/g, "</i>")
    .replace(/\u000b/g, '<i class="t">').replace(/\u000c/g, "</i>");
}

// 公理表干不干净。**空的不算干净，算「没人核过」。**
function axChip(a) {
  if (!a) return '<span class="chip NA">没打公理表</span>';
  const dirty = a.indexOf("sorryAx") >= 0 || a.indexOf("ofReduceBool") >= 0;
  return `<span class="chip ${dirty ? "FALSE" : "TRUE"}">${esc(a)}</span>`;
}

function outlineHTML(f) {
  const out = [];
  for (const it of f.outline) {
    if (it.kind === "section") {
      out.push(`<h3 class="lsec">${esc(it.name)}</h3>`);
      continue;
    }
    const thm = it.kind === "theorem";
    out.push(
      `<div class="litem${thm ? " thm" : ""}">` +
      `<div class="lhead"><span class="lkind">${it.kind}</span>` +
      `<span class="mono lname">${esc(it.name)}</span>` +
      (thm ? axChip(it.axioms) : "") + "</div>" +
      (it.doc ? `<div class="ldoc">${R.mdBlock(it.doc)}</div>` : "") +
      "</div>");
  }
  return out.join("\n");
}

// **26 个链接平铺谁也不会看**——不管摆的是角色还是文件名，一排 26 个都一样。
// 改成一个下拉：按角色分组，当前这份选中，选谁跳谁。
// 角色是 export.py 给的那一列；这里只按它分组，**不自己判**任何一份是什么。

const NAV_GROUPS = [
  ["对象", ["对象"]],
  ["规则", ["规则"]],
  ["推论（Derived/）", ["推论"]],
  ["要证的东西（Proof/）", ["证明"]],
  ["模型面对现实（Obs/）", ["观测"]],
  ["装配与破坏测试", ["装配", "破坏测试"]],
];

// **拍平路径用正则加 g，不要用字符串形式。**
// JS 的 `replace("/", "-")` 只换**第一个**，而 Python 的 `str.replace` 是全换。
// 分组分到两层之后（`Obj/Frame/World.lean`），页面生成对了、链接却指向一个
// 不存在的路径——**两边都不会报错**，只是点不开。
function shortName(x) {
  return x.name.replace(".lean", "").replace(/^(Obj|Rule|Derived)\//, "");
}

function navHTML(name) {
  const files = window.LEAN.files;
  const used = new Set();
  let opts = "";
  for (const [gname, roles] of NAV_GROUPS) {
    const xs = files.filter((x) => roles.includes(x.label));
    if (!xs.length) continue;
    opts += `<optgroup label="${gname}">`;
    for (const x of xs) {
      used.add(x.name);
      const href = x.name.replace(".lean", "").replace(/\//g, "-") + ".html";
      opts += `<option value="${href}"${x.name === name ? " selected" : ""}>`
            + `${shortName(x)} —— ${x.title}</option>`;
    }
    opts += "</optgroup>";
  }
  // **漏了的不许悄悄不见。** 新加一份 Lean 却忘了给它角色时，
  // 它会掉进这一组里露出来，而不是从导航上凭空消失。
  const rest = files.filter((x) => !used.has(x.name));
  if (rest.length) {
    opts += `<optgroup label="没归类（${rest.length} 份）">`;
    for (const x of rest) {
      const href = x.name.replace(".lean", "").replace(/\//g, "-") + ".html";
      opts += `<option value="${href}"${x.name === name ? " selected" : ""}>`
            + `${shortName(x)} —— ${x.title}</option>`;
    }
    opts += "</optgroup>";
  }
  return `<label class="picker"><span>这 ${files.length} 份 Lean</span>`
       + `<select onchange="if(this.value)location.href=this.value">${opts}</select></label>`
       + `　<a href="index.html">回形式化首页</a>`;
}

function flat(name) { return name.replace(".lean", "").replace(/\//g, "-"); }

function partsBar(f, here) {
  if (!f.parts || !f.parts.length) return "";
  const items = f.parts.map((p) => p.key === here
    ? `<span style="color:var(--dim)">${p.title}</span>`
    : `<a href="${flat(f.name)}-${p.key}.html">${p.title}</a>`);
  const whole = here === null
    ? `<span style="color:var(--dim)">整份</span>`
    : `<a href="${flat(f.name)}.html">整份</a>`;
  return `<div class="partsbar">${whole}${items.map((x) => "　" + x).join("")}</div>`;
}

// ---------------------------------------------------------------- 本局要填的

// `initPart()` / `initFile()` / `initIndex()` 三支各自把上面这些拼进页面。
// 它们里面有本局专属的东西（画盘面、语料读数表），照着本局写。
//
// 三支的分派固定成这一句——**顺序不能换**：
//
//   document.addEventListener("DOMContentLoaded",
//     () => (window.LEAN_PART ? initPart()
//          : window.LEAN_NAME ? initFile() : initIndex()));
//
// 拆页那一段还有一条必须记着的：**拆页的生成（pages.py）和打包（bundle.py）
// 必须一起改**。只改前者的话链接点不开，而首页和整份页照样满绿——
// 这种坏没有任何一条自检看得见。
//
// 这一局没有拆段：每一关本来就是一份（Proof/Levels/L<n>.lean），不需要 initPart。

function thmRows(f) {
  if (!f.theorems.length) {
    return '<tr><td colspan="2" class="note">这一份里没有定理（全是定义）。</td></tr>';
  }
  return f.theorems.map((t) => `<tr><td class="mono">${esc(t.name)}</td><td>` +
    axChip(t.axioms === null || t.axioms === undefined ? null
      : (t.axioms.length ? t.axioms.join(", ") : "不依赖任何公理")) + "</td></tr>").join("");
}

function initFile() {
  const f = window.LEAN.files.find((x) => x.name === window.LEAN_NAME);
  $("nav").innerHTML = navHTML(f.name);
  $("thms").innerHTML = thmRows(f);
  $("src").innerHTML = paint(f.src);
}

function initIndex() {
  $("nav").innerHTML = navHTML(null);
}

// 一段 Lean 附在对象 / 规则页下面：同一处源码，页面只上色。
function initInline() {
  document.querySelectorAll("[data-lean]").forEach((el) => {
    const f = window.LEAN.files.find((x) => x.name === el.dataset.lean);
    el.innerHTML = f ? paint(f.src) : "（这一份 Lean 不在导出的数据里）";
  });
}

document.addEventListener("DOMContentLoaded",
  () => (window.LEAN_INLINE ? initInline() : window.LEAN_NAME ? initFile() : initIndex()));


</script>
</body>
</html>
