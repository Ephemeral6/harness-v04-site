* { box-sizing: border-box; }

a { color: var(--link); text-decoration: none; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 64px; }

<script>
// **只画、不算。** 每一格、每一个数都是 web/export.py 在 Python 那边算好导出来的：
// 这一份只把导出的格集合画成方块、把导出的判决串画成小标签、把 Lean 源码上色。
// web/check_no_logic.py 会来这里搜对象层 / 规则层 / 形式化层的函数名，搜到就算破了。

const D = window.DATA || {};
const $ = (id) => document.getElementById(id);
const S = 11;                       // 一格画几个像素：尺寸，渲染方面的东西

function esc(s) {
  return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// 一张盘：盘面（墙 / 带 / 框）+ 这一帧的块和门带 + 导出侧给的「变了的格」。
function drawFrame(board, fr, chg, title) {
  const all = [];
  board.walls.forEach((c) => all.push(c));
  const r0 = Math.min(...all.map((c) => c[0])), c0 = Math.min(...all.map((c) => c[1]));
  const r1 = Math.max(...all.map((c) => c[0])), c1 = Math.max(...all.map((c) => c[1]));
  const W = (c1 - c0 + 1) * S, H = (r1 - r0 + 1) * S;
  const box = (c, fill, extra) =>
    `<rect x="${(c[1] - c0) * S}" y="${(c[0] - r0) * S}" width="${S}" height="${S}" fill="${fill}" ${extra || ""}/>`;
  let g = `<rect width="${W}" height="${H}" fill="var(--floor)"/>`;
  board.walls.forEach((c) => { g += box(c, "var(--wall)"); });
  board.bands.forEach((c) => { g += box(c, "var(--band)"); });
  board.slots.forEach((sl) => sl.forEach((c) => {
    g += box(c, "none", 'stroke="var(--slot)" stroke-width="1.5" stroke-dasharray="3 2"');
  }));
  fr.gates.forEach((gt) => gt.cells.forEach((c) => {
    g += box(c, "var(--gate)", 'stroke="#000" stroke-width=".5"');
  }));
  fr.gates.forEach((gt) => {
    const c = gt.cells[0];
    g += `<text x="${(c[1] - c0) * S + 2}" y="${(c[0] - r0) * S + 9}" font-size="8" fill="var(--gate-on)">${gt.count}</text>`;
  });
  fr.pieces.forEach((p) => {
    const fill = !p.shelled ? "var(--bare)" : p.sel ? "var(--piece-sel)" : p.retired ? "var(--piece-ret)" : "var(--piece)";
    p.cells.forEach((c) => { g += box(c, fill, 'stroke="#000" stroke-width=".6"'); });
  });
  (chg || []).forEach((c) => { g += box(c, "none", 'stroke="var(--chg)" stroke-width="1.6"'); });
  const bar = `预算条 ${fr.bar} / 64`;
  return `<figure class="board"><figcaption>${esc(title || "")}　<span class="mono">${bar}</span></figcaption>` +
    `<svg class="grid" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${g}</svg></figure>`;
}

function rowByNumber(n) { return D.rows.find((r) => r.row === n); }
function legend() {
  return '<div class="legend">' +
    '<span><i style="background:var(--wall)"></i>墙</span>' +
    '<span><i style="background:var(--band)"></i>带</span>' +
    '<span><i style="border:1.5px dashed var(--slot)"></i>框的内部</span>' +
    '<span><i style="background:var(--piece-sel)"></i>被操纵的块</span>' +
    '<span><i style="background:var(--piece)"></i>没被选过的块</span>' +
    '<span><i style="background:var(--piece-ret)"></i>被点走过的块</span>' +
    '<span><i style="background:var(--bare)"></i>裸十字</span>' +
    '<span><i style="background:var(--gate)"></i>门带（数字=数到几）</span>' +
    '<span><i style="border:1.6px solid var(--chg)"></i>这一步变了的格（导出侧算的）</span></div>';
}

// ---------------------------------------------------------------- 首页
function initHome() {
  document.querySelectorAll("[data-pick]").forEach((el) => {
    const n = D.picks[el.dataset.pick];
    const r = rowByNumber(n);
    if (!r) { el.innerHTML = '<span class="bad">导出侧没挑出这一帧</span>'; return; }
    const b = D.boards[String(r.lv)];
    el.innerHTML = drawFrame(b, D.frames[r.p], null, `row ${r.row} 之前（第 ${r.lv} 关）`) +
      (r.tag === "levelup" ? "" : drawFrame(b, D.frames[r.n], r.chg, `按 ${r.act} 之后`));
  });
  const lg = $("legend");
  if (lg) lg.innerHTML = legend();
}

// ---------------------------------------------------------------- 回放
function initReplay() {
  const segSel = $("seg"), slider = $("slider");
  let rows = [];
  function show() {
    const r = rows[+slider.value];
    if (!r) return;
    const b = D.boards[String(r.lv)] || D.boards["0"];
    const nb = D.boards[String(r.lvn)] || b;
    $("label").textContent = `row ${r.row}（段内第 ${+slider.value + 1} / ${rows.length}）· 第 ${r.lv} 关 · 动作 ${r.act} · 标记 ${r.tag}`;
    $("frames").innerHTML = drawFrame(b, D.frames[r.p], null, "这一步之前") +
      drawFrame(r.tag === "ok" || r.tag === "over" ? b : nb, D.frames[r.n], r.chg,
        r.tag === "levelup" ? "之后（已经是下一关的盘）" : r.tag === "reset" ? "之后（RESET：模型不描述）" : "这一步之后");
    let v = "";
    D.rule_order.forEach((nm, i) => {
      const k = r.v[i];
      v += `<span><span class="chip ${k}">${k === "T" ? "对" : k === "F" ? "错" : "不管"}</span> ` +
        `<a href="rules/${nm}.html">${nm}</a></span>`;
    });
    $("verdicts").innerHTML = v;
  }
  function load() {
    const s = +segSel.value;
    rows = D.rows.filter((r) => r.seg === s);
    slider.max = rows.length - 1;
    slider.value = 0;
    show();
  }
  segSel.onchange = load;
  slider.oninput = show;
  $("prev").onclick = () => { slider.value = Math.max(0, +slider.value - 1); show(); };
  $("next").onclick = () => { slider.value = Math.min(rows.length - 1, +slider.value + 1); show(); };
  $("legend").innerHTML = legend();
  load();
}

// ---------------------------------------------------------------- Lean 源码上色（只认注释、字符串和几十个词）
const KEY = ("theorem|def|abbrev|structure|inductive|namespace|end|import|deriving|" +
  "by|fun|match|with|let|have|show|if|then|else|where|open").split("|");
const TAC = ("simp|decide|rfl|exact|intro|cases|obtain|refine|induction|split|rw|unfold|absurd|calc").split("|");
function paint(src) {
  let h = esc(src);
  h = h.replace(/\/-[\s\S]*?-\//g, (m) => `\u0001${m}\u0002`);
  h = h.replace(/--[^\n]*/g, (m) => `\u0001${m}\u0002`);
  h = h.replace(/(^|[^\w'])(#print|#eval)\b/g, (m, a, b) => `${a}\u0005${b}\u0006`);
  const kw = new RegExp("(^|[^\\w'.])(" + KEY.join("|") + ")(?![\\w'])", "g");
  h = h.replace(kw, (m, a, b) => `${a}\u0007${b}\u0008`);
  const tc = new RegExp("(^|[^\\w'.])(" + TAC.join("|") + ")(?![\\w'])", "g");
  h = h.replace(tc, (m, a, b) => `${a}\u000b${b}\u000c`);
  return h
    .replace(/\u0001/g, '<i class="c">').replace(/\u0002/g, "</i>")
    .replace(/\u0005/g, '<i class="p">').replace(/\u0006/g, "</i>")
    .replace(/\u0007/g, '<i class="k">').replace(/\u0008/g, "</i>")
    .replace(/\u000b/g, '<i class="t">').replace(/\u000c/g, "</i>");
}

document.addEventListener("DOMContentLoaded", () => {
  document.querySelectorAll("pre.lean").forEach((el) => { el.innerHTML = paint(el.textContent); });
  if (document.body.dataset.page === "home") initHome();
  if (document.body.dataset.page === "replay") initReplay();
});

</script>
