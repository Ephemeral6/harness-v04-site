<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>对象 · world</title>
<style>
/* 只有尺寸与配色。**这个文件是「渲染方面的东西」的全部**，别往里加别的。

   这一份是**跨局可搬的**：底下那一块「世界的配色」按本局改名字，别的原样拿走。
   两局各写一套页面的代价在 `meta/PIPELINE.md`「前端也只该有一份形状」里。 */
:root {
  --bg: #12141a;  --panel: #1a1d25;  --line: #2a2f3a;
  --ink: #e8eaf0;  --dim: #8b93a7;  --faint: #5a6275;

  /* ↓↓↓ **本局专属** ↓↓↓
     这一局的回放是把**真实的帧**逐格画出来（帧是观测，不是世界），色号 → 屏幕颜色那张表只有一个来源：
     export.py 从官方 arc_agi.rendering.COLOR_MAP 取出写进 DATA.palette，site.js 的 PAL 读它（给 canvas 用）。
     这里只剩页面本身的两个颜色名。 */
  --link: #7ab8ff;  --fg: #e8eaf0;
  /* ↑↑↑ 本局专属到此为止 ↑↑↑ */

  --ok: #4caf7d;  --bad: #e5544b;  --na: #4a5163;
}

* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14px/1.6 "Segoe UI", system-ui, -apple-system, "Noto Sans SC", sans-serif;
}
a { color: #7ab8ff; text-decoration: none; }
a:hover { text-decoration: underline; }
code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; }

.wrap { max-width: 1240px; margin: 0 auto; padding: 24px 20px 64px; }
header { border-bottom: 1px solid var(--line); padding-bottom: 14px; margin-bottom: 20px; }
header h1 { margin: 0 0 4px; font-size: 20px; font-weight: 600; letter-spacing: .3px; }
header .sub { color: var(--dim); font-size: 13px; }
header nav { margin-top: 10px; display: flex; gap: 16px; font-size: 13px; }

/* **一行一张卡。** 原来是 1fr + 380px 两栏，于是「说得更细一点」和
   「为什么删不掉它」「它的 Lean」挤在同一行里，哪一段是哪一段看不出来。 */
.cols { display: block; }
.cols > div + div { margin-top: 16px; }

.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
.card + .card { margin-top: 16px; }
.card h2 { margin: 0 0 12px; font-size: 13px; font-weight: 600; color: var(--dim);
           text-transform: uppercase; letter-spacing: .8px; }

.boards { display: flex; gap: 18px; flex-wrap: wrap; align-items: flex-start; }
.board figcaption { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
svg.grid { display: block; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; }

.controls { display: flex; align-items: center; gap: 10px; margin: 14px 0 6px; flex-wrap: wrap; }
button { background: #232834; color: var(--ink); border: 1px solid var(--line);
         border-radius: 6px; padding: 5px 11px; cursor: pointer; font-size: 13px; }
button:hover { background: #2c3340; }
button:disabled { opacity: .4; cursor: default; }
input[type=range] { flex: 1; min-width: 180px; accent-color: #59b0ff; }
.step-label { color: var(--dim); font-size: 13px; min-width: 190px; }

table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--dim); font-weight: 500; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }

.chip { display: inline-block; min-width: 46px; text-align: center; padding: 1px 7px;
        border-radius: 4px; font-size: 11px; font-weight: 600; letter-spacing: .4px; }
.chip.TRUE { background: rgba(76,175,125,.16); color: var(--ok); }
.chip.FALSE { background: rgba(229,84,75,.18); color: var(--bad); }
.chip.NA { background: #222732; color: var(--faint); }

.why { color: var(--dim); font-size: 12px; }
.kv { display: grid; grid-template-columns: 116px 1fr; gap: 3px 10px; font-size: 13px; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; }

.legend { display: flex; flex-wrap: wrap; gap: 12px 18px; font-size: 12px; color: var(--dim); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px;
            vertical-align: -2px; margin-right: 5px; border: 1px solid var(--line); }

.note { color: var(--dim); font-size: 12.5px; }
.note strong { color: var(--ink); }
pre.doc { white-space: pre-wrap; font-size: 13px; line-height: 1.65; margin: 0;
          font-family: inherit; }
pre.doc b { color: #ffd88a; font-weight: 600; }
ul.tight { margin: 6px 0 0; padding-left: 18px; }
ul.tight li { margin: 3px 0; }

.rulelist { display: grid; gap: 10px; }
.rulelist a.row { display: grid; grid-template-columns: 210px 1fr auto; gap: 14px;
                  padding: 11px 14px; background: var(--panel); border: 1px solid var(--line);
                  border-radius: 8px; color: var(--ink); }
.rulelist a.row:hover { border-color: #3c4658; text-decoration: none; }
.rulelist .nm { font-family: ui-monospace, Consolas, monospace; font-size: 13px; color: #7ab8ff; }
.rulelist .cl { color: var(--dim); font-size: 13px; }

/* 规则文档的排版 */
#doc h3 { font-size: 13.5px; margin: 20px 0 8px; color: #ffd88a; font-weight: 600; }
#doc h3:first-child { margin-top: 0; }
#doc p { margin: 9px 0; }
#doc p:first-child { margin-top: 0; }
#doc table.doc { margin: 10px 0; font-size: 12.5px; }
#doc table.doc th { color: var(--dim); }
#doc pre.fixed { margin: 9px 0; padding: 9px 12px; background: #15181f;
                 border: 1px solid var(--line); border-radius: 6px;
                 font-family: ui-monospace, Consolas, monospace; font-size: 12px;
                 line-height: 1.6; white-space: pre-wrap; color: #cfd6e6; }
#doc code, .note code, td code { background: #22273200; color: #9ecbff;
                                 font-family: ui-monospace, Consolas, monospace; font-size: 12.5px; }

/* 每页最上面那一段人话 + 图 */
.hero { background: linear-gradient(180deg, #1c2330, #1a1d25);
        border: 1px solid #313a4a; border-radius: 12px; padding: 20px 22px; margin-bottom: 20px; }
.hero .plain { font-size: 15.5px; line-height: 1.85; margin-bottom: 16px; }
.hero .plain p { margin: 10px 0; }
.hero .plain p:first-child { margin-top: 0; }
.hero .plain b { color: #ffd88a; }
.hero .plain code { color: #9ecbff; }
pre.doc.small { font-size: 12px; line-height: 1.6;
                font-family: ui-monospace, Consolas, monospace; color: #b9c2d4;
                max-height: 560px; overflow: auto; }

/* ── 形式化页 ───────────────────────────────────────────────────────────── */
td.ok, .ok { color: var(--ok); }
td.bad, .bad { color: var(--bad); font-weight: 600; }

#outline { max-height: 1400px; overflow: auto; }
.lsec { font-size: 12px; margin: 22px 0 10px; color: #ffd88a; font-weight: 600;
        letter-spacing: .5px; border-bottom: 1px solid var(--line); padding-bottom: 6px; }
.lsec:first-child { margin-top: 0; }
.litem { padding: 9px 0 9px 11px; border-left: 2px solid var(--line); margin: 8px 0; }
.litem.thm { border-left-color: #3b5a7a; }
.lhead { display: flex; align-items: baseline; gap: 9px; flex-wrap: wrap; }
.lkind { font-size: 10.5px; color: var(--faint); text-transform: uppercase;
         letter-spacing: .6px; min-width: 62px; }
.lname { font-size: 13px; color: #9ecbff; }
.litem.thm .lname { color: #7ab8ff; }
.ldoc { margin-top: 5px; color: var(--dim); font-size: 12.5px; line-height: 1.7; }
.ldoc p { margin: 6px 0; }
.ldoc p:first-child { margin-top: 0; }
.ldoc b { color: var(--ink); }
.ldoc code { color: #9ecbff; }
.ldoc table.doc { font-size: 12px; margin: 8px 0; }
.lhead .chip { min-width: 0; font-weight: 500; letter-spacing: 0;
               font-family: ui-monospace, Consolas, monospace; }

pre.lean { margin: 0; padding: 14px 16px; background: #0f1218; border: 1px solid var(--line);
           border-radius: 8px; overflow: auto; max-height: 720px;
           font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
           font-size: 12px; line-height: 1.62; color: #cfd6e6; }
pre.lean i { font-style: normal; }
pre.lean i.c { color: #5f6b80; }        /* 注释 */
pre.lean i.s { color: #b5cea8; }        /* 字符串 */
pre.lean i.k { color: #c08cdc; }        /* 关键字 */
pre.lean i.t { color: #6fb3c8; }        /* 策略 */
pre.lean i.p { color: #d79a5b; }        /* #print / #eval */

/* 具体的盘 */
.card.scene { margin-top: 16px; }
.card.scene h2 { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 2px;
                 text-transform: none; font-size: 14px; color: var(--ink); }
.scene .boards { align-items: flex-start; gap: 22px; }
.scene-words { flex: 1 1 320px; min-width: 300px; font-size: 14px; line-height: 1.8; }
.scene-words p { margin: 8px 0; }
.scene-words p:first-child { margin-top: 0; }
.scene-words b { color: #ffd88a; }
.scene-words code { color: #9ecbff; }
.scene details { margin-top: 14px; }
.scene summary { cursor: pointer; color: var(--dim); font-size: 12.5px; padding: 4px 0; }
.scene summary:hover { color: var(--ink); }
.scene details pre.lean { margin-top: 8px; max-height: 460px; }

.navsep { color: #3a4152; margin: 0 .35em 0 .15em; user-select: none }

/* 挑一份 Lean 看：下拉，不是一排 26 个链接 */
.picker { display: inline-flex; align-items: center; gap: 8px; font-size: 12px; color: var(--dim) }
.picker select {
  background: var(--panel); color: var(--fg); border: 1px solid var(--line);
  border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12px; max-width: 420px;
}
.picker select:hover { border-color: #4a5265 }
.grouphead {
  margin: 20px 0 8px; font-size: 12px; color: var(--dim);
  letter-spacing: .8px; text-transform: uppercase;
}
.grouphead:first-child { margin-top: 0 }

/* 一份 Lean 拆成几段时，段与段之间的横条 */
.partsbar { margin-top: 8px; font-size: 12px; }
.partsbar a { color: var(--link) }

/* 一份 Lean 拆开之后，每一段在首页上单独一行 */
.subrows { margin: 2px 0 10px 18px; border-left: 1px solid var(--line); padding-left: 12px }
.sub-row {
  display: flex; gap: 12px; align-items: baseline; padding: 5px 0;
  color: var(--fg); text-decoration: none; font-size: 13px;
}
.sub-row:hover { color: var(--link) }
.sub-row .cl { flex: 1 }

/* 缺口摆在最上面：黄边，和「判准没过」的红分开 */
.gapcard { border-color: #6b5a24; background: #1f1c14; margin-bottom: 16px; }
.gapcard h2 { color: #e9c46a; }
figure.board { margin: 0; }
canvas { display: block; image-rendering: pixelated; border: 1px solid var(--line); border-radius: 4px; }
.controls button { margin-right: 4px; }

</style>

UE、抹掉后判错（液面被钉死，搬运就对不上了）。\n4. 分离表：**分得开**，语料里就有见证：第 1 / 407 帧（seq 1 的 next 与 seq 204 的 next），\n   两个世界除液面外一模一样。三个读数（分离表 / 消融 / 点名）一致。卡 03 / 06 都判：留。\n","ablation":{"第一帧的值":{"readers":{"press_button":420,"win_align":394,"gauge_signal":265,"click_gauge":33},"errors":{"win_align":389,"press_button":336,"gauge_signal":227,"click_gauge":18},"witness":{"seq":7,"rule":"press_button","real":"C","erased":"E"}},"最后一帧的值":{"readers":{"press_button":312,"win_align":19,"gauge_signal":74,"click_gauge":33},"errors":{},"witness":{"seq":7,"rule":"press_button","real":"C","erased":"E"}}}},{"field":"gauge_look","why":"字段 gauge_look —— 每段量规此刻显示的颜色（为什么删不掉）\n\n1. 记的是什么：每段量规此刻画成什么颜色（不透明 id，只许判相等）。它是「亮 / 暗」的**观测**；亮暗本身是液面的函数。\n2. 谁读它（卡 06 消融）：**只有 gauge_signal**（颜色变了 ⟺ 亮暗翻了）。\n3. 抹成常量之后：第一帧常量那一次**一处干净改判都没有**（第一帧所在的第 0 关没有量规，常量是空元组，\n   改判全是「跑不起来」）——这就是「扰动太温柔 / 扰动不合法」的样子；换成最后一帧的常量之后，\n   seq 78 上 gauge_signal 原判 TRUE、抹掉后判错（量规点亮了而颜色被钉住）。**两种扰动的读数都留着**。\n4. 分离表：**分不开**——它在一关之内由液面决定（亮一色、暗一色），和 levels 同进同出。\n   卡 03 当时列成欠账（缺谁读它），卡 06 判：**留**。理由：它是「颜色跟着亮暗翻」这句话唯一的落脚处；\n   删掉它，gauge_signal 就没有东西可判，parse 里只剩「同一帧里亮的同色、暗的同色、亮暗不同色」那一半。\n   形式化那一边不带它（gauge_signal 的身份是「不进模型」：颜色是观测，模型只有亮暗这个函数）。\n","ablation":{"第一帧的值":{"readers":{"gauge_signal":415},"errors":{"gauge_signal":415},"witness":null},"最后一帧的值":{"readers":{"gauge_signal":74},"errors":{},"witness":{"seq":78,"rule":"gauge_signal","real":"C","erased":"E"}}}},{"field":"used","why":"字段 used —— 顶栏已消耗几格（为什么删不掉）\n\n1. 记的是什么：顶栏从最右起连续几格是「已消耗」色。形状本身（右起连续一段）是 parse 的良构检查。\n2. 谁读它（卡 06 消融）：**只有 hud_cost**（身份：不进模型）。\n3. 抹成常量之后：第一帧常量（0）那一次**一处都没改判**——0 恰好是一个合法值，前后都抹成 0，\n   「涨 0~2 格」「换关归零」全都照样成立。这是卡 06 自己撞上的「扰动太温柔，和没人读长得一模一样」：\n   只跑这一种扰动的话，这一位会被报成「没人读」。换成最后一帧的常量（16）之后，\n   seq 13 上 hud_cost 原判 TRUE、抹掉后判错（换关那一步顶栏该归零）。\n4. 分离表：**分得开**，语料见证：第 0 / 1 帧（seq 1 前后，只差顶栏）。\n   卡 06 判：留在 World（它是帧上看得见的量，parse 的重画要它），但**不进形式化**：\n   涨几格取决于这一关的换算尺度，一帧上读不出来。\n","ablation":{"第一帧的值":{"readers":{},"errors":{},"witness":null},"最后一帧的值":{"readers":{"hud_cost":17},"errors":{},"witness":{"seq":13,"rule":"hud_cost","real":"C","erased":"E"}}}}],"lean":{"path":"Obj/World.lean","source":"/-\n# World —— 版面 + 局面（对应 `objects/world.py`）\n\nPython 的 `World` 是一整个；这里拆成两半：\n\n    Board   一关之内不变：隔条 / 槽的轮廓 / 按钮 / 目标 / 量规\n    State   点击会改的：液面 / 光标\n\n`step : Board → State → Act → Res`——结果里只有 `State`，**没有 `Board` 的位置**。\n于是「走一步版面变了」这句话写不出来（规则 board_static 在这一层的样子：表示不出来）。\n\n顶栏（Python 的 `World.used`）和量规显示的颜色（`World.gauge_look`）**不在这里**：\n两条都是「不进模型」——前者涨几格取决于一帧上读不出来的换算尺度，后者是观测，模型只有亮不亮这个函数。\n-/\n\nimport Obj.Geometry.Span\nimport Obj.Geometry.Click\nimport Obj.Geometry.Idx\nimport Obj.Board.Band\nimport Obj.Board.Zone\nimport Obj.Board.Button\nimport Obj.Board.Target\nimport Obj.Board.Gauge\nimport Obj.Piece.Cursor\n\nnamespace Game\n\nstructure Board where\n  bands   : List Band\n  zones   : List Zone\n  buttons : List Button\n  targets : List Target\n  gauges  : List Gauge\nderiving Repr, DecidableEq\n\nstructure State where\n  levels  : List Nat\n  cursors : List Cursor\nderiving Repr, DecidableEq\n\nstructure World where\n  board : Board\n  st    : State\nderiving Repr, DecidableEq\n\n/-- 这一局唯一的动作：点一格。点在盘面外面（边框上）是 `off`。RESET **不是**一个动作——它不进模型。 -/\ninductive Act where\n  | click (lane depth : Nat)\n  | off\nderiving Repr, DecidableEq\n\n/-- 走一步的结果。`won` 是「这一步之后换关」，`na` 是**模型说不出话**（对家读不出唯一答案之类）。\n    `na` 不是 `ok`：说不出话不是「什么都没变」。 -/\ninductive Res where\n  | ok (s : State)\n  | won\n  | na\nderiving Repr, DecidableEq\n\n/-- 盘面有几道：隔条和槽的道区间里最大的那一道 + 1（Python 卡 03 删掉的 size，可以由这两样算出来）。 -/\ndef Board.nLanes (b : Board) : Nat :=\n  (b.zones.map (fun (z : Zone) => z.lanes.hi + 1) ++ b.bands.map (fun (x : Band) => x.lanes.hi + 1)).foldl max 0\n\n/-- 盘面有几深。 -/\ndef Board.nDepths (b : Board) : Nat := (b.zones.map (fun (z : Zone) => z.depths.hi + 1)).foldl max 0\n\n/-- 合法的一下：点在盘面里，或者点在盘外（那一下什么都不做，但它是这个游戏真有的一下）。\n    **谈可不可做必须把动作限死**，否则「一步跨到目标」这种事就说得出来了。 -/\ndef Act.legal (b : Board) : Act → Bool\n  | .click l d => Nat.blt l b.nLanes && Nat.blt d b.nDepths\n  | .off => true\n\nend Game\n"}}]};</script>
<script>
// **页面那一侧：只画，不算。**
//
// 每一个数、每一个框、每一句「这一下点中了什么」都是 web/export.py 在 Python 那边算好导出来的
// （window.DATA）。这一份只摆数据、只画图形；新增的只有两样：尺寸和配色。
// web/check_no_logic.py 会来这里搜世界那一侧的函数名，搜到就算破了。

(function () {
  const D = window.DATA || {};
  const P = window.PAGE || { kind: "home", up: "" };
  const $ = (id) => document.getElementById(id);

  // ---------------------------------------------------------------- 配色（渲染方面的东西）
  // 帧里的色号 → 屏幕上的颜色。色号本身是不透明 id；这张表只有一个来源：
  // export.py 从官方 arc_agi.rendering.COLOR_MAP 取出写进 DATA.palette（下标 = 色号）。这里不抄。
  const PAL = D.palette || [];

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function md(s) {
    return esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
  }
  function pick(path) {
    let x = D;
    for (const k of path.split(".")) {
      if (x == null) return undefined;
      x = x[k];
    }
    return x;
  }
  function chip(cls, text) { return `<span class="chip ${cls}">${esc(text)}</span>`; }
  function vchip(v) {
    if (v === "C") return chip("TRUE", "判对");
    if (v === "E") return chip("FALSE", "判错");
    if (v === "U") return chip("FALSE", "读不成");
    if (v === "ERR") return chip("FALSE", "跑不起来");
    return chip("NA", "不开口");
  }

  // 散文里的数：`<span data-k="路径">`。缺了就写「缺」，不留旧数。
  function fillNumbers() {
    for (const el of document.querySelectorAll("[data-k]")) {
      const v = pick(el.getAttribute("data-k"));
      el.textContent = v === undefined ? "缺" : v;
      if (v === undefined) el.className = "bad";
    }
  }

  function gapsBanner() {
    const g = D.gaps || [];
    if (!g.length || !$("gaps")) return;
    $("gaps").innerHTML = `<div class="card gapcard"><h2>缺口（明写的，不是判准没过）</h2><ul class="tight">`
      + g.map((x) => `<li>${md(x)}</li>`).join("") + "</ul></div>";
  }

  // ---------------------------------------------------------------- 画一帧
  function canvasOf(fi, changed, px) {
    const hex = (D.frames || [])[fi];
    const c = document.createElement("canvas");
    const s = px || 5;
    c.width = 64 * s; c.height = 64 * s;
    const g = c.getContext("2d");
    if (!hex) return c;
    for (let i = 0; i < 4096; i++) {
      g.fillStyle = PAL[parseInt(hex[i], 16)];
      g.fillRect((i % 64) * s, Math.floor(i / 64) * s, s, s);
    }
    if (changed) {
      g.strokeStyle = "#ff3b30"; g.lineWidth = 1;
      for (const [r, cc] of changed) g.strokeRect(cc * s + 0.5, r * s + 0.5, s - 1, s - 1);
    }
    return c;
  }
  function figure(fi, caption, changed, px) {
    const f = document.createElement("figure");
    f.className = "board";
    const cap = document.createElement("figcaption");
    cap.innerHTML = caption;
    f.appendChild(cap);
    f.appendChild(canvasOf(fi, changed, px));
    return f;
  }
  function rowBySeq(seq) { return (D.rows || []).find((r) => r.seq === seq); }
  function pairInto(el, seq, text) {
    const r = rowBySeq(seq);
    if (!el || !r) { if (el) el.innerHTML = `<p class="note bad">导出里没有这一步（缺）</p>`; return; }
    el.appendChild(figure(r.prevF, `seq ${r.seq} · 点之前`, null, 4));
    el.appendChild(figure(r.nextF, `点之后 · ${esc(r.word)}（框出来的是变了的格）`, r.changed, 4));
    if (text) {
      const p = document.createElement("p");
      p.className = "note"; p.innerHTML = text; el.appendChild(p);
    }
  }

  // ---------------------------------------------------------------- 首页
  function home() {
    const pk = D.picks || {};
    pairInto($("shotPress"), pk.onButton, "点了一个按钮：它所在的槽涨了一个隔条厚度，隔条对岸的槽落了同样多，光标跟着液面挪。");
    const blk = $("shotBlock");
    if (pk.onStarved) pairInto(blk, pk.onStarved, "源槽不够搬：除了顶栏，一格都没变。（这一步在语料的非认证段里）");
    if (pk.onCapped) pairInto(blk, pk.onCapped, "墙太矮：得到方已经顶到墙高，这一下整次作废。（同样在非认证段里）");
    pairInto($("shotGauge"), pk.onGauge, "点亮着的量规：隔条两侧的光标整套送到对岸，液面一格没动。");
    const r = rowBySeq(pk.lastWin);
    if (r && $("shotWin")) {
      $("shotWin").appendChild(figure(r.prevF, `seq ${r.seq} · 最后一下之前`, null, 4));
      $("shotWin").appendChild(figure(r.nextF, `最后一下之后：每个光标都停在自己的目标深度上、贴着嵌目标的那条隔条`, r.changed, 4));
    }
  }

  // ---------------------------------------------------------------- 回放
  function replay() {
    const rows = D.rows || [];
    const sl = $("slider");
    sl.max = rows.length - 1;
    let i = 0;
    for (const j of D.jumps || []) {
      const b = document.createElement("button");
      b.textContent = j.label;
      b.onclick = () => { i = j.index; show(); };
      $("jumps").appendChild(b);
    }
    function show() {
      const r = rows[i];
      sl.value = i;
      $("label").textContent = `第 ${i + 1} / ${rows.length} 行 · seq ${r.seq} · 第 ${r.lvl} 关`;
      $("pair").innerHTML = "";
      $("pair").appendChild(figure(r.prevF, "点之前", null, 5));
      $("pair").appendChild(figure(r.nextF, "点之后", r.changed, 5));
      const leanWord = { yes: chip("TRUE", "模型说对了"), no: chip("FALSE", "模型被驳倒"), na: chip("NA", "模型不描述这一步") }[r.lean] || chip("NA", "缺");
      $("stepinfo").innerHTML = `<dl class="kv">
        <dt>动作</dt><dd class="mono">${esc(r.action)}</dd>
        <dt>点中了什么</dt><dd>${esc(r.word)}</dd>
        <dt>变了几格</dt><dd>${r.changed.length}</dd>
        <dt>上游报的关卡</dt><dd>${r.lvl} → ${r.lvlNext}（${esc(r.state)}）</dd>
        <dt>这一行的标记</dt><dd>${r.marks.length ? r.marks.map((m) => `<b>${esc(m)}</b>：${esc((D.corpus.markWhy || {})[m])}`).join("<br>") : "（无：认证段里同一关的一步）"}</dd>
        <dt>形式化那一层</dt><dd>${leanWord} <span class="note">（内核逐行算过，和规则那一侧逐行相等：corpus_reconciled）</span></dd></dl>`;
      const vs = Object.entries(r.verdicts).map(([k, v]) =>
        `<tr><td class="mono"><a href="rules/${k}.html">${esc(k)}</a></td><td>${vchip(v.startsWith("N:") ? "N" : v)}</td>`
        + `<td class="why">${v.startsWith("N:") ? esc(v.slice(2)) : ""}</td></tr>`).join("");
      $("verdicts").innerHTML = `<table><tr><th>规则</th><th>判决</th><th>不开口的理由</th></tr>${vs}</table>`;
      const w = r.world, n = r.worldNext;
      const cur = (x) => x.cursors.map((c) => `色 ${c.color} 在槽 ${c.zone}（第 ${c.lane} 道起，宽 ${c.width}）`).join("；") || "（没有光标）";
      $("world").innerHTML = `<table>
        <tr><th style="width:120px">液面（每个槽）</th><td class="mono">${w.levels.join(", ")}</td><td class="mono">${n.levels.join(", ")}</td></tr>
        <tr><th>光标</th><td>${cur(w)}</td><td>${cur(n)}</td></tr>

  const KEY = ("theorem|def|abbrev|structure|inductive|instance|namespace|end|import|deriving|" +
    "by|fun|match|with|let|have|show|if|then|else|do|where|from|using|open").split("|");
  const TAC = ("simp|omega|decide|rfl|exact|intro|intros|cases|rcases|obtain|refine|constructor|" +
    "rintro|induction|split|rw|apply|unfold|absurd|first|next|subst|rename_i").split("|");
  function paint(src) {
    let h = esc(src);
    h = h.replace(/\/-[\s\S]*?-\//g, (m) => `\u0001${m}\u0002`);
    h = h.replace(/--[^\n]*/g, (m) => `\u0001${m}\u0002`);
    h = h.replace(/"[^"\n]*"/g, (m) => `\u0003${m}\u0004`);
    h = h.replace(/(^|[^\w'])(#print|#eval)\b/g, (m, a, b) => `${a}\u0005${b}\u0006`);
    const kw = new RegExp("(^|[^\\w'.])(" + KEY.join("|") + ")(?![\\w'])", "g");
    h = h.replace(kw, (m, a, b) => `${a}\u0007${b}\u0008`);
    const tc = new RegExp("(^|[^\\w'.])(" + TAC.join("|") + ")(?![\\w'])", "g");
    h = h.replace(tc, (m, a, b) => `${a}\u000b${b}\u000c`);
    return h
      .replace(/\u0001/g, '<i class="c">').replace(/\u0002/g, "</i>")
      .replace(/\u0003/g, '<i class="s">').replace(/\u0004/g, "</i>")
      .replace(/\u0005/g, '<i class="p">').replace(/\u0006/g, "</i>")
      .replace(/\u0007/g, '<i class="k">').replace(/\u0008/g, "</i>")

      <tr><th>判据自己被判据核</th><td>${vm ? `种子必红：${vm.seed_alive ? "活的" : "<b class='bad'>死的</b>"}<br>` + vm.mutants.map((m) => `${m.red ? chip("TRUE", "红") : chip("FALSE", "没红")} ${esc(m.mutant)}（该红在：${esc(m.want)}）`).join("<br>") : "<b class='bad'>缺（verify_mutants 没跑）</b>"}</td></tr>
      <tr><th>装置的 lean_check</th><td>${dev ? `ok=${dev.ok}<br>` + dev.owed.map((o) => `${esc(o.kind)}`).join("<br>") : "（这一次没跑）"}</td></tr>
      </table>`;
    const groups = {};
    for (const f of L.files) (groups[f.role] = groups[f.role] || []).push(f);
    let fl = leanPicker(null);
    for (const role of ROLE_ORDER) {
      if (!groups[role]) continue;
      fl += `<div class="grouphead">${role}</div><div class="rulelist">` + groups[role].map((f) =>
        `<a class="row" href="${leanHref(f.path)}"><span class="nm">${esc(f.path)}</span><span class="cl">${md(f.title)}</span><span>${chip("NA", `${f.theorems.length} 条定理`)}</span></a>`).join("") + "</div>";
    }
    $("files").innerHTML = fl;
  }
  function leanFile() {
    if (P.key === "Broken.lean") {
      const b = D.lean.broken;
      $("leanfile").innerHTML = `<div class="card">${leanPicker("Broken.lean")}</div><div class="card"><h2>读数</h2>
        <p>${b.ok ? chip("TRUE", "编不过，只红在标记行") : chip("FALSE", "没过")} 退出码 ${b.rc}；红在第 ${b.error_lines.join(",")} 行；标记在第 ${b.marker_line} 行。</p></div>
        <div class="card"><h2>源码</h2><pre class="lean">${paint(b.source || "")}</pre></div>`;
      return;
    }
    const f = D.lean.files.find((x) => x.path === P.key);
    if (!f) { $("leanfile").innerHTML = "<p class='bad'>缺</p>"; return; }
    const th = f.theorems.map((t) => `<div class="litem thm"><div class="lhead"><span class="lkind">theorem</span><span class="mono lname">${esc(t.name)}</span>${axChip(t.axioms)}</div>`
      + (f.thmDocs[t.name] ? `<div class="ldoc">${md(f.thmDocs[t.name])}</div>` : "") + "</div>").join("");
    $("leanfile").innerHTML = `<div class="card">${leanPicker(f.path)}</div>
      <div class="card"><h2>${esc(f.role)} · 编译 ${f.rc === 0 ? chip("TRUE", "编过") : chip("FALSE", "没编过")} ${f.seconds} 秒${f.python ? ` · 对应 <code>${esc(f.python)}</code>` : ""}</h2>
      <pre class="doc">${md(f.head)}</pre></div>
      <div class="card"><h2>定理与公理表（${f.theorems.length} 条）</h2>${th || "<p class='note'>这一份里一条定理都没有——它只有定义。</p>"}</div>
      <div class="card"><h2>源码</h2><pre class="lean">${paint(f.source)}</pre></div>`;
  }

  function howto() {}

  document.addEventListener("DOMContentLoaded", () => {
    gapsBanner();
    fillNumbers();
    ({ home, replay, objIndex, obj, ruleIndex, rule, leanIndex, leanFile, howto }[P.kind] || home)();
  });
})();

</script>
</body>
</html>
